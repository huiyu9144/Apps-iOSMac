<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PicShrink — 设计预览</title>
<style>
  :root {
    --bg: #f0f0f4;
    --panel-bg: rgba(255,255,255,0.82);
    --panel-border: rgba(0,0,0,0.08);
    --panel-shadow: rgba(0,0,0,0.08);
    --text-primary: #1d1d1f;
    --text-secondary: #86868b;
    --text-tertiary: #aeaeb2;
    --separator: rgba(0,0,0,0.06);
    --accent: #007aff;
    --accent-hover: #0066d6;
    --card-bg: rgba(0,0,0,0.035);
    --input-bg: rgba(0,0,0,0.04);
    --progress-bg: rgba(0,0,0,0.08);
    --progress-fill: #007aff;
    --radio-border: #c7c7cc;
    --success: #34c759;
    --tag-bg: rgba(0,0,0,0.05);
    --tag-text: #666;
    --btn-text: #fff;
    --menu-bar: rgba(255,255,255,0.55);
    --menu-bar-border: rgba(0,0,0,0.15);
    --desktop-dot: rgba(0,0,0,0.2);
    --desktop-dot-active: rgba(0,0,0,0.5);
    --settings-overlay: rgba(0,0,0,0.35);
    --settings-panel: rgba(255,255,255,0.96);
    --switch-track: #e9e9ed;
    --switch-thumb: #fff;
    --switch-on: #34c759;
    --badge-bg: #ff3b30;
  }

  .dark {
    --bg: #1c1c1e;
    --panel-bg: rgba(44,44,46,0.88);
    --panel-border: rgba(255,255,255,0.08);
    --panel-shadow: rgba(0,0,0,0.4);
    --text-primary: #f5f5f7;
    --text-secondary: #98989d;
    --text-tertiary: #636366;
    --separator: rgba(255,255,255,0.06);
    --accent: #0a84ff;
    --accent-hover: #409cff;
    --card-bg: rgba(255,255,255,0.06);
    --input-bg: rgba(255,255,255,0.08);
    --progress-bg: rgba(255,255,255,0.1);
    --progress-fill: #0a84ff;
    --radio-border: #545458;
    --success: #30d158;
    --tag-bg: rgba(255,255,255,0.07);
    --tag-text: #98989d;
    --btn-text: #fff;
    --menu-bar: rgba(44,44,46,0.65);
    --menu-bar-border: rgba(255,255,255,0.12);
    --desktop-dot: rgba(255,255,255,0.25);
    --desktop-dot-active: rgba(255,255,255,0.6);
    --settings-overlay: rgba(0,0,0,0.55);
    --settings-panel: rgba(44,44,46,0.97);
    --switch-track: #39393d;
    --switch-thumb: #f5f5f7;
    --switch-on: #30d158;
    --badge-bg: #ff453a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 30px 20px 60px;
    transition: background .3s, color .3s;
    -webkit-font-smoothing: antialiased;
  }

  /* ─── Desktop Menu Bar ─── */
  .desktop-bar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 28px;
    background: var(--menu-bar);
    backdrop-filter: blur(18px) saturate(1.4);
    -webkit-backdrop-filter: blur(18px) saturate(1.4);
    border-bottom: 1px solid var(--menu-bar-border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 14px;
    z-index: 100;
    font-size: 12.5px;
    font-weight: 500;
    user-select: none;
  }
  .desktop-bar .left { display: flex; align-items: center; gap: 16px; }
  .desktop-bar .left .apple-logo { font-size: 15px; font-weight: 400; }
  .desktop-bar .left span { opacity: .8; }
  .desktop-bar .right { display: flex; align-items: center; gap: 10px; }
  .desktop-bar .right .icon { opacity: .65; font-size: 13px; }
  .desktop-bar .right .icon.active-icon {
    opacity: 1;
    background: var(--accent);
    color: #fff;
    border-radius: 4px;
    padding: 0 5px;
    font-size: 12px;
    line-height: 18px;
  }
  .desktop-bar .right .time { opacity: .7; font-size: 12px; }
  .desktop-bar .dot { width: 4px; height: 4px; border-radius: 50%; background: var(--desktop-dot); }
  .desktop-bar .dot.active { background: var(--desktop-dot-active); width: 5px; height: 5px; }

  /* ─── Layout ─── */
  .page-title {
    margin-top: 60px;
    text-align: center;
    margin-bottom: 30px;
  }
  .page-title h1 {
    font-size: 32px;
    font-weight: 700;
    letter-spacing: -0.5px;
  }
  .page-title p {
    color: var(--text-secondary);
    font-size: 14px;
    margin-top: 6px;
  }
  .page-title .badge {
    display: inline-block;
    background: var(--accent);
    color: #fff;
    font-size: 11px;
    font-weight: 600;
    padding: 2px 10px;
    border-radius: 20px;
    margin-top: 8px;
    letter-spacing: 0.3px;
  }

  .mockup-wrapper {
    display: flex;
    gap: 40px;
    align-items: flex-start;
    justify-content: center;
    flex-wrap: wrap;
    width: 100%;
    max-width: 960px;
  }

  .mockup-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .mockup-label {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-secondary);
    letter-spacing: 0.8px;
    text-transform: uppercase;
    opacity: 0.7;
  }

  /* ─── Popover Panel ─── */
  .popover {
    width: 340px;
    background: var(--panel-bg);
    backdrop-filter: blur(30px) saturate(1.3);
    -webkit-backdrop-filter: blur(30px) saturate(1.3);
    border-radius: 16px;
    border: 1px solid var(--panel-border);
    box-shadow: 0 12px 48px var(--panel-shadow), 0 2px 8px var(--panel-shadow);
    overflow: hidden;
    transition: background .3s, border-color .3s, box-shadow .3s;
  }

  .popover-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px 10px;
  }
  .popover-header h2 {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: -0.2px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .popover-header h2 .arrow-icon {
    font-size: 13px
