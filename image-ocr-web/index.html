<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Image OCR</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, '.SFNSDisplay', 'SF Pro Display', 'Helvetica Neue', sans-serif;
  background: #000; color: #fff; min-height: 100vh;
  display: flex; flex-direction: column; align-items: center;
  padding: 32px 16px 48px;
  -webkit-font-smoothing: antialiased;
}

.header { text-align: center; margin-bottom: 32px; padding: 0 8px; }
.header h1 {
  font-size: 30px; font-weight: 700; letter-spacing: -0.5px;
  background: linear-gradient(135deg, #5ac8fa, #64d2ff);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
.header p { color: rgba(255,255,255,0.72); font-size: 14px; margin-top: 6px; font-weight: 400; letter-spacing: 0.2px; }
.container { width: 100%; max-width: 960px; display: flex; flex-direction: column; gap: 20px; }

/* Mode indicator */
.mode-badge {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 10px; border-radius: 20px;
  font-size: 10px; font-weight: 600; letter-spacing: 0.3px;
}
.mode-badge.api { background: rgba(90,200,250,0.15); color: #5ac8fa; }
.mode-badge.local { background: rgba(255,204,0,0.12); color: #ffcc00; }

/* Preload Banner */
.preload-banner {
  display: flex; align-items: center; gap: 14px;
  padding: 14px 18px;
  background: rgba(90,200,250,0.08);
  border: 1px solid rgba(90,200,250,0.15);
  border-radius: 14px;
  animation: fadeSlideUp 0.35s cubic-bezier(0.25,0.46,0.45,0.94) both;
}
.preload-banner.done { background: rgba(52,199,89,0.08); border-color: rgba(52,199,89,0.15); }
.preload-banner.hide { display: none; }
.preload-spinner {
  width: 20px; height: 20px; flex-shrink: 0;
  border: 2px solid rgba(90,200,250,0.2); border-top-color: #5ac8fa;
  border-radius: 50%; animation: spin 0.8s linear infinite;
}
.preload-banner.done .preload-spinner {
  border: none; background: #34c759; border-radius: 50%;
  width: 20px; height: 20px; display: flex; align-items: center; justify-content: center;
  font-size: 12px; color: #fff; animation: none;
}
.preload-banner.done .preload-spinner::after { content: '✓'; }
.preload-text { flex: 1; font-size: 13px; color: rgba(255,255,255,0.7); line-height: 1.4; }
.preload-text strong { color: #5ac8fa; font-weight: 600; }
.preload-banner.done .preload-text strong { color: #34c759; }
.preload-pct { font-size: 12px; color: rgba(255,255,255,0.4); font-variant-numeric: tabular-nums; flex-shrink: 0; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Upload Area */
.upload-area {
  border: 1.5px dashed rgba(255,255,255,0.15);
  border-radius: 14px; padding: 28px 20px; text-align: center;
  cursor: pointer; transition: all 0.35s cubic-bezier(0.25,0.46,0.45,0.94);
  background: rgba(255,255,255,0.04); backdrop-filter: blur(2px);
}
.upload-area:hover { border-color: rgba(90,200,250,0.5); background: rgba(90,200,250,0.06); }
.upload-area.dragover { border-color: #5ac8fa; background: rgba(90,200,250,0.1); transform: scale(1.01); }
.upload-icon { width: 34px; height: 34px; margin: 0 auto 8px; color: #5ac8fa; }
.upload-area p { color: rgba(255,255,255,0.88); font-size: 14px; font-weight: 400; }
.upload-area .hint { font-size: 12px; color: rgba(255,255,255,0.56); margin-top: 4px; }

/* Controls */
.controls {
  display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
  background: rgba(255,255,255,0.06); border-radius: 14px; padding: 20px;
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  animation: fadeSlideUp 0.35s cubic-bezier(0.25,0.46,0.45,0.94) both;
}
.control-group { display: flex; flex-direction: column; gap: 6px; }
.control-group label { font-size: 13px; font-weight: 500; color: rgba(255,255,255,0.78); letter-spacing: 0.3px; }

.lang-selector { display: flex; flex-wrap: wrap; gap: 6px; }
.lang-btn {
  padding: 7px 12px; border-radius: 8px;
  border: 1.5px solid rgba(255,255,255,0.1);
  background: rgba(0,0,0,0.3); color: rgba(255,255,255,0.55);
  font-size: 12px; font-weight: 500; cursor: pointer;
  transition: all 0.25s; font-family: inherit; user-select: none;
}
.lang-btn:hover { border-color: rgba(90,200,250,0.3); color: rgba(255,255,255,0.8); }
.lang-btn.active { background: rgba(90,200,250,0.2); border-color: rgba(90,200,250,0.4); color: #fff; font-weight: 600; }
.lang-desc { font-size: 11px; color: rgba(255,255,255,0.52); margin-top: 4px; line-height: 1.4; }

/* Content */
.content-area {
  display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
  animation: fadeSlideUp 0.35s cubic-bezier(0.25,0.46,0.45,0.94) both;
}
.card {
  background: rgba(255,255,255,0.06); border-radius: 14px; overflow: hidden;
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
}
.card-header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 13px 16px; font-size: 13px; font-weight: 500;
  color: rgba(255,255,255,0.78); border-bottom: 1px solid rgba(255,255,255,0.06);
}
.card-header .dim { color: rgba(255,255,255,0.52); font-weight: 400; font-size: 12px; }
.card-header .mode { font-size: 11px; }

.preview-wrap {
  display: flex; align-items: center; justify-content: center;
  min-height: 200px; padding: 14px;
  background: repeating-conic-gradient(rgba(255,255,255,0.04) 0% 25%, rgba(255,255,255,0.08) 0% 50%) 0 0 / 18px 18px;
}
.preview-wrap canvas { max-width: 100%; max-height: 340px; border-radius: 6px; display: block; box-shadow: 0 2px 8px rgba(0,0,0,0.4); }
.preview-placeholder { color: rgba(255,255,255,0.48); font-size: 13px; text-align: center; padding: 60px 20px; }

.result-body { padding: 0; flex: 1; display: flex; flex-direction: column; }
.result-text-wrap { padding: 16px; overflow: auto; max-height: 340px; min-height: 200px; flex: 1; }
.result-text-wrap::-webkit-scrollbar { width: 4px; }
.result-text-wrap::-webkit-scrollbar-track { background: transparent; }
.result-text-wrap::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }
.result-text { font-size: 14px; line-height: 1.7; color: #fff; white-space: pre-wrap; word-break: break-word; font-family: inherit; }
.result-empty { color: rgba(255,255,255,0.35); font-size: 13px; text-align: center; padding: 60px 20px; }

.ocr-status { display: none; align-items: center; gap: 12px; padding: 14px 16px; border-top: 1px solid rgba(255,255,255,0.06); font-size: 12px; color: rgba(255,255,255,0.56); }
.ocr-status.show { display: flex; }
.ocr-spinner { width: 18px; height: 18px; border: 2px solid rgba(90,200,250,0.2); border-top-color: #5ac8fa; border-radius: 50%; animation: spin 0.8s linear infinite; flex-shrink: 0; }
.ocr-status-text { flex: 1; }
.ocr-status-pct { flex-shrink: 0; font-variant-numeric: tabular-nums; }
.result-actions { display: flex; gap: 8px; padding: 0 16px 14px; }

.actions {
  display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;
  animation: fadeSlideUp 0.35s cubic-bezier(0.25,0.46,0.45,0.94) both;
}
.btn {
  padding: 12px 24px; border-radius: 12px; border: none;
  font-size: 14px; font-weight: 600; cursor: pointer;
  transition: all 0.3s; display: inline-flex; align-items: center; gap: 8px;
  white-space: nowrap; font-family: inherit; letter-spacing: 0.3px;
  position: relative; overflow: hidden;
}
.btn::after { content: ''; position: absolute; inset: 0; background: rgba(255,255,255,0); transition: background 0.3s; }
.btn:hover::after { background: rgba(255,255,255,0.06); }
.btn:active { transform: scale(0.97); }
.btn-primary { background: rgba(90,200,250,0.6); color: #fff; }
.btn-primary:hover { background: rgba(90,200,250,0.7); }
.btn-primary:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }
.btn-secondary { background: rgba(255,255,255,0.1); color: #fff; }
.btn-secondary:hover { background: rgba(255,255,255,0.14); }
.btn-outline { background: transparent; border: 1.5px solid rgba(255,255,255,0.15); color: rgba(255,255,255,0.65); }
.btn-outline:hover { border-color: rgba(255,255,255,0.3); color: #fff; }

/* History */
.history-section {
  background: rgba(255,255,255,0.06); border-radius: 14px; overflow: hidden;
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  animation: fadeSlideUp 0.35s cubic-bezier(0.25,0.46,0.45,0.94) both;
}
.history-header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 14px 18px; font-size: 13px; font-weight: 500;
  color: rgba(255,255,255,0.78); border-bottom: 1px solid rgba(255,255,255,0.06);
}
.history-header .count { color: #5ac8fa; font-weight: 600; }
.history-body { max-height: 220px; overflow-y: auto; padding: 8px; }
.history-body::-webkit-scrollbar { width: 4px; }
.history-body::-webkit-scrollbar-track { background: transparent; }
.history-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }
.history-item { display: flex; gap: 10px; padding: 10px; border-radius: 10px; cursor: pointer; transition: background 0.2s; align-items: flex-start; }
.history-item:hover { background: rgba(255,255,255,0.04); }
.history-thumb { width: 48px; height: 48px; border-radius: 6px; object-fit: cover; background: rgba(255,255,255,0.04); flex-shrink: 0; }
.history-info { flex: 1; min-width: 0; }
.history-text { font-size: 12px; color: rgba(255,255,255,0.7); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.5; }
.history-meta { font-size: 10px; color: rgba(255,255,255,0.3); margin-top: 4px; }
.history-empty { padding: 30px; text-align: center; color: rgba(255,255,255,0.3); font-size: 13px; }

.toast {
  position: fixed; bottom: 36px; left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: rgba(30,30,30,0.95); color: #fff;
  padding: 12px 24px; border-radius: 12px; font-size: 14px; font-weight: 500;
  opacity: 0; transition: all 0.4s cubic-bezier(0.25,0.46,0.45,0.94);
  pointer-events: none; z-index: 100;
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  box-shadow: 0 8px 32px rgba(0,0,0,0.5);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@keyframes fadeSlideUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }

@media (max-width:700px) {
  body { padding:20px 12px 40px; }
  .controls { grid-template-columns:1fr; }
  .content-area { grid-template-columns:1fr; }
  .header h1 { font-size:24px; }
}
</style>
</head>
<body>

<div class="header">
  <h1>Image OCR</h1>
  <p>图片文字识别 · 云端 API 毫秒级识别 · 离线 Tesseract 兜底</p>
</div>

<div class="container">
  <!-- Preload Banner -->
  <div class="preload-banner" id="preloadBanner">
    <div class="preload-spinner" id="preloadSpinner"></div>
    <div class="preload-text" id="preloadText">
      正在后台预加载 OCR 引擎 <strong>(离线备用)</strong>…
    </div>
    <span class="preload-pct" id="preloadPct">0%</span>
  </div>

  <div class="upload-area" id="uploadArea">
    <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
      <polyline points="17 8 12 3 7 8"/>
      <line x1="12" y1="3" x2="12" y2="15"/>
    </svg>
    <p>拖拽图片到此处，或点击上传</p>
    <p class="hint">支持 JPG / PNG / WebP</p>
    <input type="file" id="fileInput" accept="image/*" style="display:none">
  </div>

  <div class="controls" id="controlsSection" style="display:none">
    <div>
      <div class="control-group">
        <label>识别语言</label>
        <div class="lang-selector">
          <button class="lang-btn active" data-lang="chi_sim">简体中文</button>
          <button class="lang-btn active" data-lang="eng">English</button>
          <button class="lang-btn" data-lang="jpn">日本語</button>
          <button class="lang-btn" data-lang="kor">한국어</button>
        </div>
        <div class="lang-desc">选中多种语言可混合识别</div>
      </div>
    </div>
    <div style="display:flex;flex-direction:column;gap:10px;justify-content:center">
      <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end">
        <button class="btn btn-primary" id="recognizeBtn" style="padding:10px 20px;font-size:13px">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          开始识别
        </button>
        <button class="btn btn-outline" id="resetBtn" style="padding:10px 16px;font-size:13px">重新选择</button>
      </div>
    </div>
  </div>

  <div class="content-area" id="contentSection" style="display:none">
    <div class="card">
      <div class="card-header"><span>图片预览</span><span class="dim" id="imageDims">—</span></div>
      <div class="preview-wrap">
        <canvas id="previewCanvas"></canvas>
        <div class="preview-placeholder" id="previewPlaceholder">点击「上传」选择图片</div>
      </div>
    </div>
    <div class="card" style="display:flex;flex-direction:column">
      <div class="card-header">
        <span>识别结果</span>
        <span class="mode" id="resultLang">—</span>
      </div>
      <div class="result-body" style="flex:1;display:flex;flex-direction:column">
        <div class="result-text-wrap" id="resultTextWrap">
          <div class="result-empty" id="resultEmpty">识别后结果将显示在此处</div>
          <div class="result-text" id="resultText" style="display:none"></div>
        </div>
        <div class="ocr-status" id="ocrStatus">
          <div class="ocr-spinner"></div>
          <span class="ocr-status-text" id="ocrStatusText">正在识别…</span>
          <span class="ocr-status-pct" id="ocrStatusPct"></span>
        </div>
        <div class="result-actions" id="resultActions" style="display:none">
          <button class="btn btn-secondary" id="copyBtn" style="padding:7px 16px;font-size:12px">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:4px">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
            </svg>
            复制文本
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="history-section" id="historySection" style="display:none">
    <div class="history-header">
      <span>识别历史 <span class="count" id="historyCount">0</span> 条</span>
      <button class="btn btn-outline" id="clearHistoryBtn" style="padding:5px 12px;font-size:11px;border-radius:8px">清空历史</button>
    </div>
    <div class="history-body" id="historyBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ═══════════════════════════════════════════════════════
// 配置区 — 部署 Worker 后填入下方 URL 即可启用 API 模式
// ═══════════════════════════════════════════════════════
//
// 你的 Cloudflare Worker 地址（部署 worker.js 后获得）
// 例如: https://ocr-api.your-name.workers.dev
// 不填 = 使用 Tesseract.js 本地识别（1-3s）
// 填了 = 使用云端 API 识别（<500ms）
//
const WORKER_URL = ''; // ← 在这里填入你的 Worker URL

// ═══════════════════════════════════════════════════════

const TESS_LANG_MAP = {
  chi_sim: { label:'简体中文', code:'chi_sim' },
  eng:     { label:'English',  code:'eng' },
  jpn:     { label:'日本語',   code:'jpn' },
  kor:     { label:'한국어',    code:'kor' },
};
const DEFAULT_LANGS = ['chi_sim', 'eng'];

const state = {
  sourceImage: null, fileName: '', fileSize: 0,
  imageWidth: 0, imageHeight: 0,
  ocrResult: '', isRecognizing: false,
  selectedLangs: [...DEFAULT_LANGS],
  workerReady: false,
  useApi: !!WORKER_URL,
  apiAvailable: !!WORKER_URL, // 假设可用，失败后再切本地
};

let worker = null;
const $ = (id) => document.getElementById(id);

// DOM
const preloadBanner = $('preloadBanner');
const preloadText = $('preloadText');
const preloadPct = $('preloadPct');
const uploadArea = $('uploadArea');
const fileInput = $('fileInput');
const controlsSection = $('controlsSection');
const contentSection = $('contentSection');
const previewCanvas = $('previewCanvas');
const previewPlaceholder = $('previewPlaceholder');
const imageDims = $('imageDims');
const resultText = $('resultText');
const resultEmpty = $('resultEmpty');
const resultTextWrap = $('resultTextWrap');
const resultLang = $('resultLang');
const ocrStatus = $('ocrStatus');
const ocrStatusText = $('ocrStatusText');
const ocrStatusPct = $('ocrStatusPct');
const resultActions = $('resultActions');
const recognizeBtn = $('recognizeBtn');
const resetBtn = $('resetBtn');
const copyBtn = $('copyBtn');
const historySection = $('historySection');
const historyBody = $('historyBody');
const historyCount = $('historyCount');
const clearHistoryBtn = $('clearHistoryBtn');
const langBtns = document.querySelectorAll('.lang-btn');
const toastEl = $('toast');

// ─── 启动提示 ──────────────────────────────────────────
if (state.useApi) {
  preloadText.innerHTML = `API 模式 <strong>✓ 识别 &lt;500ms</strong> · 离线备用引擎后台加载中…`;
} else {
  preloadText.innerHTML = `离线模式 · 后台加载 Tesseract 引擎 <strong>(识别约 1-3s)</strong>`;
}

// ─── 预加载 Tesseract（仅作为 API 失败的兜底）────────
async function preloadEngine() {
  if (state.useApi) {
    // API 模式：轻量预加载，失败无所谓
    try {
      worker = await Tesseract.createWorker('eng', 1, {
        logger: (info) => {
          if (info.progress !== undefined) {
            preloadPct.textContent = `${Math.round(info.progress*100)}%`;
          }
        },
      });
      state.workerReady = true;
      preloadBanner.classList.add('done');
      preloadPct.textContent = '100%';
      preloadText.innerHTML = 'API 模式 ✓ · 备用引擎已就绪';
    } catch {
      preloadBanner.classList.add('hide');
    }
  } else {
    // 离线模式：完整预加载
    try {
      worker = await Tesseract.createWorker(DEFAULT_LANGS.join('+'), 1, {
        logger: (info) => {
          if (info.progress !== undefined) {
            preloadPct.textContent = `${Math.round(info.progress*100)}%`;
            preloadText.innerHTML = `正在加载离线引擎 ${Math.round(info.progress*100)}%…`;
          }
        },
      });
      state.workerReady = true;
      preloadBanner.classList.add('done');
      preloadPct.textContent = '100%';
      preloadText.innerHTML = '离线引擎已就绪 ✓ 可直接识别';
    } catch {
      preloadBanner.classList.add('hide');
    }
  }
}
preloadEngine();

// ─── 核心 OCR ──────────────────────────────────────────

async function ocrViaAPI(img, langs) {
  const canvas = document.createElement('canvas');
  canvas.width = img.width;
  canvas.height = img.height;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(img, 0, 0);
  const dataUrl = canvas.toDataURL('image/jpeg', 0.9);

  const resp = await fetch(WORKER_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ image: dataUrl, langs, filename: state.fileName }),
  });

  const data = await resp.json();
  if (!data.success) throw new Error(data.error || 'API error');
  return data.text;
}

async function ocrViaTesseract(img, langs) {
  const w = worker || await Tesseract.createWorker(langs.join('+'), 1);
  if (!state.workerReady) worker = w;
  state.workerReady = true;

  await w.setParameters({
    logger: (info) => {
      if (info.status === 'recognizing text') ocrStatusText.textContent = '本地识别中…';
      if (info.progress !== undefined) ocrStatusPct.textContent = `${Math.round(info.progress*100)}%`;
    },
  });

  const { data } = await w.recognize(img, langs.join('+'));
  return data.text;
}

async function runOCR() {
  if (!state.sourceImage) { showToast('请先上传图片'); return; }
  if (state.selectedLangs.length === 0) { showToast('请选择至少一种语言'); return; }

  state.isRecognizing = true;
  recognizeBtn.disabled = true;
  ocrStatus.classList.add('show');
  resultActions.style.display = 'none';
  resultText.style.display = 'none';
  resultEmpty.style.display = 'block';
  resultEmpty.textContent = '识别中…';

  const startTime = performance.now();

  try {
    const langs = [...state.selectedLangs];
    resultLang.textContent = langs.map(l => TESS_LANG_MAP[l]?.label||l).join(', ');
    let text = '';
    let mode = '';

    // 先尝试 API
    if (state.apiAvailable) {
      try {
        ocrStatusText.textContent = '云端识别中…';
        ocrStatusPct.textContent = '';
        text = await ocrViaAPI(state.sourceImage, langs);
        mode = 'api';
      } catch (err) {
        console.warn('API failed, falling back to local:', err);
        state.apiAvailable = false;
        // 继续走本地
      }
    }

    // API 失败或未配置 → 本地 Tesseract
    if (!mode) {
      ocrStatusText.textContent = state.workerReady ? '本地识别中…' : '正在加载离线引擎…';
      ocrStatusPct.textContent = state.workerReady ? '' : '0%';
      text = await ocrViaTesseract(state.sourceImage, langs);
      mode = 'local';
    }

    const elapsed = ((performance.now() - startTime) / 1000).toFixed(1);
    state.ocrResult = text;

    if (text.trim()) {
      resultText.textContent = text;
      resultText.style.display = 'block';
      resultEmpty.style.display = 'none';
      resultActions.style.display = 'flex';
      resultTextWrap.scrollTop = 0;

      // 显示模式标签
      const badge = mode === 'api'
        ? `<span class="mode-badge api">⚡ API ${elapsed}s</span>`
        : `<span class="mode-badge local">🔄 本地 ${elapsed}s</span>`;
      resultLang.innerHTML = `${langs.map(l => TESS_LANG_MAP[l]?.label||l).join(', ')} ${badge}`;

      await navigator.clipboard.writeText(text).catch(() => {});
      showToast(`识别完成 (${elapsed}s)，文本已复制到剪贴板`);

      const canvas = document.createElement('canvas');
      canvas.width = 96;
      canvas.height = Math.round(96 / (state.imageWidth / state.imageHeight));
      const ctx = canvas.getContext('2d');
      ctx.imageSmoothingEnabled = true;
      ctx.drawImage(state.sourceImage, 0, 0, canvas.width, canvas.height);
      addHistory({
        text, langs: [...langs],
        dims: `${state.imageWidth} × ${state.imageHeight}`,
        thumb: canvas.toDataURL('image/jpeg', 0.6), timestamp: Date.now(),
        mode,
      });
    } else {
      resultEmpty.textContent = '未识别到文字，请尝试其他语言或更清晰的图片';
      resultEmpty.style.display = 'block';
      showToast('未识别到文字');
    }
  } catch (err) {
    console.error('OCR error:', err);
    resultEmpty.textContent = '识别出错: ' + err.message;
    resultEmpty.style.display = 'block';
    showToast('识别出错');
  } finally {
    state.isRecognizing = false;
    recognizeBtn.disabled = false;
    ocrStatus.classList.remove('show');
  }
}

// ─── 工具函数 ──────────────────────────────────────────

function loadHistory() {
  try { return JSON.parse(localStorage.getItem('ocr_history') || '[]'); } catch { return []; }
}
function saveHistory(items) { localStorage.setItem('ocr_history', JSON.stringify(items)); }

function addHistory(entry) {
  const items = loadHistory();
  items.unshift(entry);
  if (items.length > 20) items.length = 20;
  saveHistory(items);
  renderHistory();
}

function clearHistory() { saveHistory([]); renderHistory(); showToast('历史已清空'); }

function renderHistory() {
  const items = loadHistory();
  historyCount.textContent = items.length;
  if (items.length === 0) { historySection.style.display = 'none'; return; }
  historySection.style.display = 'block';
  historyBody.innerHTML = items.map((item, idx) => {
    const date = new Date(item.timestamp);
    const timeStr = date.toLocaleString('zh-CN', { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' });
    const langs = (item.langs||[]).map(l => TESS_LANG_MAP[l]?.label||l).join(', ');
    const modeBadge = item.mode === 'api' ? '⚡' : '🔄';
    return `
      <div class="history-item" data-idx="${idx}">
        <img class="history-thumb" src="${item.thumb||''}" alt="">
        <div class="history-info">
          <div class="history-text">${escHtml((item.text||'').substring(0,120))}</div>
          <div class="history-meta">${timeStr} · ${langs} · ${item.dims||''} ${modeBadge}</div>
        </div>
      </div>
    `;
  }).join('');
  historyBody.querySelectorAll('.history-item').forEach((el) => {
    el.addEventListener('click', () => {
      const idx = parseInt(el.dataset.idx);
      const items = loadHistory();
      if (items[idx]) {
        resultText.textContent = items[idx].text;
        resultText.style.display = 'block';
        resultEmpty.style.display = 'none';
        resultActions.style.display = 'flex';
        resultLang.textContent = (items[idx].langs||[]).map(l=>TESS_LANG_MAP[l]?.label||l).join(', ');
        resultTextWrap.scrollTop = 0;
      }
    });
  });
}

function escHtml(str) { const d = document.createElement('div'); d.textContent = str; return d.innerHTML; }

// ─── 事件绑定 ──────────────────────────────────────────

langBtns.forEach((btn) => {
  btn.addEventListener('click', () => {
    const lang = btn.dataset.lang;
    btn.classList.toggle('active');
    if (btn.classList.contains('active')) {
      if (!state.selectedLangs.includes(lang)) state.selectedLangs.push(lang);
    } else {
      state.selectedLangs = state.selectedLangs.filter(l => l !== lang);
      if (state.selectedLangs.length === 0) {
        btn.classList.add('active');
        state.selectedLangs.push(lang);
      }
    }
  });
});

uploadArea.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', () => { if (fileInput.files[0]) loadFile(fileInput.files[0]); });
uploadArea.addEventListener('dragover', (e) => { e.preventDefault(); uploadArea.classList.add('dragover'); });
uploadArea.addEventListener('dragleave', () => { uploadArea.classList.remove('dragover'); });
uploadArea.addEventListener('drop', (e) => {
  e.preventDefault(); uploadArea.classList.remove('dragover');
  if (e.dataTransfer.files[0] && e.dataTransfer.files[0].type.startsWith('image/')) {
    loadFile(e.dataTransfer.files[0]);
  } else { showToast('请拖入图片文件'); }
});

function loadFile(file) {
  state.ocrResult = '';
  resultText.style.display = 'none';
  resultEmpty.style.display = 'block';
  resultActions.style.display = 'none';
  ocrStatus.classList.remove('show');
  resultLang.textContent = '—';

  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      state.sourceImage = img;
      state.fileName = file.name;
      state.fileSize = file.size;
      state.imageWidth = img.width;
      state.imageHeight = img.height;
      controlsSection.style.display = 'grid';
      contentSection.style.display = 'grid';

      const canvas = previewCanvas;
      previewPlaceholder.style.display = 'none';
      const maxH = 340;
      const scale = img.height > maxH ? maxH / img.height : 1;
      canvas.width = Math.round(img.width * scale);
      canvas.height = Math.round(img.height * scale);
      const ctx = canvas.getContext('2d');
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      imageDims.textContent = `${img.width} × ${img.height}`;
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

resetBtn.addEventListener('click', () => {
  state.sourceImage = null; state.ocrResult = '';
  controlsSection.style.display = 'none';
  contentSection.style.display = 'none';
  previewPlaceholder.style.display = 'block';
  resultText.style.display = 'none'; resultEmpty.style.display = 'block';
  resultActions.style.display = 'none'; ocrStatus.classList.remove('show');
  resultLang.textContent = '—'; imageDims.textContent = '—';
  previewCanvas.width = 0; previewCanvas.height = 0;
  fileInput.value = '';
});

copyBtn.addEventListener('click', async () => {
  if (!state.ocrResult) return;
  try { await navigator.clipboard.writeText(state.ocrResult); showToast('已复制到剪贴板'); }
  catch {
    const ta = document.createElement('textarea');
    ta.value = state.ocrResult; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
    showToast('已复制到剪贴板');
  }
});

recognizeBtn.addEventListener('click', runOCR);
clearHistoryBtn.addEventListener('click', clearHistory);

let toastTimer = null;
function showToast(msg) {
  toastEl.textContent = msg; toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2400);
}

renderHistory();
</script>
</body>
