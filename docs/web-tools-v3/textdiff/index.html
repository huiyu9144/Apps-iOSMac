<body>

<div class="header">
  <h1>TextDiff</h1>
  <p>文本 / 代码差异对比 · 逐行逐字 · 高亮增删改</p>
</div>

<div class="container">

  <div class="panel">
    <div class="control-row">
      <div class="control-group" style="flex:1">
        <label>比较模式</label>
        <div class="mode-selector" id="diffModeSelector" style="max-width:300px">
          <div class="mode-slider" id="diffModeSlider"></div>
          <button class="mode-btn active" data-mode="line">逐行比较</button>
          <button class="mode-btn" data-mode="word">逐字比较</button>
        </div>
      </div>
      <div class="toggle-wrap">
        <label class="toggle-switch">
          <input type="checkbox" id="ignoreWhitespace">
          <div class="toggle-track"><div class="toggle-thumb"></div></div>
        </label>
        <label for="ignoreWhitespace">忽略空白符</label>
      </div>
    </div>
  </div>

  <div class="editors">
    <div class="editor-box">
      <div class="editor-label">
        <span>原始文本 (A)</span>
        <span class="file-btn" id="uploadLeftBtn">📄 上传文件</span>
      </div>
      <div class="text-input-wrap">
        <textarea id="leftInput" placeholder="粘贴原始文本或代码..." style="min-height:220px">Hello World
This is a test
Same line here
Removed line
Keep this one</textarea>
      </div>
      <input type="file" id="leftFileInput" accept=".txt,.js,.ts,.py,.html,.css,.json,.md" style="display:none">
    </div>
    <div class="editor-box">
      <div class="editor-label">
        <span>修改后文本 (B)</span>
        <span class="file-btn" id="uploadRightBtn">📄 上传文件</span>
      </div>
      <div class="text-input-wrap">
        <textarea id="rightInput" placeholder="粘贴修改后文本或代码..." style="min-height:220px">Hello World
This is a modified test
Same line here
Added new line
Keep this one</textarea>
      </div>
      <input type="file" id="rightFileInput" accept=".txt,.js,.ts,.py,.html,.css,.json,.md" style="display:none">
    </div>
  </div>

  <div class="panel diff-output" id="diffOutput">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <div class="panel-title" style="margin-bottom:0">差异对比</div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-sm btn-outline" id="copyDiffBtn">复制差异</button>
        <button class="btn btn-sm btn-secondary" id="exportHtmlBtn">导出 HTML</button>
      </div>
    </div>
    <div class="stats" id="statsArea">
      <span>总行数: <span class="num purple" id="totalLines">0</span></span>
      <span>新增: <span class="num green" id="addLines">0</span></span>
      <span>删除: <span class="num red" id="delLines">0</span></span>
      <span>修改: <span class="num yellow" id="modLines">0</span></span>
      <span>变化: <span class="num purple" id="changePercent">0%</span></span>
    </div>
    <div id="diffContent"><div class="diff-empty">在两侧输入框中粘贴文本进行对比</div></div>
  </div>

  <div class="footer">
    <a href="/docs/support.html">隐私政策</a> · © 2025 TextDiff
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const toastEl = $('toast');
let toastTimer = null;

function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2400);
}

function escHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function lcs(a, b) {
  const m = a.length, n = b.length;
  const dp = Array.from({length: m + 1}, () => new Int32Array(n + 1));
  for (let i = 1; i <= m; i++) {
    for (let j = 1; j <= n; j++) {
      dp[i][j] = a[i-1] === b[j-1] ? dp[i-1][j-1] + 1 : Math.max(dp[i-1][j], dp[i][j-1]);
    }
  }
  const result = [];
  let i = m, j = n;
  while (i > 0 && j > 0) {
    if (a[i-1] === b[j-1]) {
      result.unshift({ type: 'eq', value: a[i-1], ai: i-1, bi: j-1 });
      i--; j--;
    } else if (dp[i-1][j] >= dp[i][j-1]) {
      result.unshift({ type: 'del', value: a[i-1], ai: i-1, bi: -1 });
      i--;
    } else {
      result.unshift({ type: 'add', value: b[j-1], ai: -1, bi: j-1 });
      j--;
    }
  }
  while (i > 0) {
    result.unshift({ type: 'del', value: a[i-1], ai: i-1, bi: -1 });
    i--;
  }
  while (j > 0) {
    result.unshift({ type: 'add', value: b[j-1], ai: -1, bi: j-1 });
    j--;
  }
  return result;
}

function wordDiff(a, b) {
  const al = a.split(/\b/), bl = b.split(/\b/);
  const seq = lcs(al, bl);
  let i = 0, j = 0;
  const lines = [];
  let cur = { type: 'eq', a: '', b: '' };
  function flush() {
    if (cur.a || cur.b) lines.push({ ...cur });
    cur = { type: 'eq', a: '', b: '' };
  }
  seq.forEach(item => {
    if (item.type === 'eq') {
      if (cur.type === 'eq') { cur.a += item.value; cur.b += item.value; }
      else { flush(); cur.a += item.value; cur.b += item.value; cur.type = 'eq'; }
    } else if (item.type === 'del') {
      if (cur.type === 'mod' || cur.type === 'del') { cur.a += item.value; cur.type = 'mod'; }
      else { flush(); cur.a = item.value; cur.b = ''; cur.type = 'mod'; }
    } else {
      if (cur.type === 'mod' || cur.type === 'add') { cur.b += item.value; cur.type = 'mod'; }
      else { flush(); cur.a = ''; cur.b = item.value; cur.type = 'mod'; }
    }
  });
  flush();
  return lines;
}

function computeDiff() {
  const left = $('leftInput').value;
  const right = $('rightInput').value;
  const ignoreWS = $('ignoreWhitespace').checked;
  const mode = document.querySelector('#diffModeSelector .mode-btn.active').dataset.mode;

  let aLines = left.split('\n');
  let bLines = right.split('\n');

  if (ignoreWS) {
    aLines = aLines.map(l => l.trimEnd());
    bLines = bLines.map(l => l.trimEnd());
  }

  const diff = lcs(aLines, bLines);

  const diffContent = $('diffContent');
  const totalLines = $('totalLines');
  const addLines = $('addLines');
  const delLines = $('delLines');
  const modLines = $('modLines');
  const changePercent = $('changePercent');

  let add = 0, del = 0, mod = 0;
  let html;
  let aNum = 0, bNum = 0;

  if (mode === 'word') {
    html = '<table class="diff-table">';
    diff.forEach(item => {
      if (item.type === 'eq') {
        aNum++; bNum++;
        const cls = item.value === '' ? 'line-eq' : 'line-eq';
        html += `<tr class="${cls}"><td class="line-num">${aNum}</td><td class="line-num">${bNum}</td><td>${escHtml(item.value)}</td></tr>`;
      } else if (item.type === 'del') {
        aNum++;
        del++;
        html += `<tr class="line-del"><td class="line-num">${aNum}</td><td class="line-num"></td><td>${escHtml(item.value)}</td></tr>`;
      } else {
        bNum++;
        add++;
        html += `<tr class="line-add"><td class="line-num"></td><td class="line-num">${bNum}</td><td>${escHtml(item.value)}</td></tr>`;
      }
    });
    html += '</table>';
    modLines.textContent = '0';
  } else {
    html = '<table class="diff-table">';
    diff.forEach(item => {
      if (item.type === 'eq') {
        aNum++; bNum++;
        html += `<tr class="line-eq"><td class="line-num">${aNum}</td><td class="line-num">${bNum}</td><td>${escHtml(item.value)}</td></tr>`;
      } else if (item.type === 'del') {
        aNum++;
        del++;
        html += `<tr class="line-del"><td class="line-num">${aNum}</td><td class="line-num"></td><td>${escHtml(item.value)}</td></tr>`;
      } else {
        bNum++;
        add++;
        html += `<tr class="line-add"><td class="line-num"></td><td class="line-num">${bNum}</td><td>${escHtml(item.value)}</td></tr>`;
      }
    });
    html += '</table>';
    modLines.textContent = '0';
  }

  diffContent.innerHTML = html || '<div class="diff-empty">两段文本完全一致</div>';
  totalLines.textContent = diff.length;
  addLines.textContent = add;
  delLines.textContent = del;
  const total = add + del;
  const maxLen = Math.max(aLines.length, bLines.length);
  changePercent.textContent = maxLen > 0 ? Math.round((total / maxLen) * 100) + '%' : '0%';
}

const leftInput = $('leftInput');
const rightInput = $('rightInput');
const ignoreWS = $('ignoreWhitespace');

let debounceTimer;
function debounceDiff() {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(computeDiff, 250);
}

leftInput.addEventListener('input', debounceDiff);
rightInput.addEventListener('input', debounceDiff);
ignoreWS.addEventListener('change', computeDiff);

$('uploadLeftBtn').addEventListener('click', () => $('leftFileInput').click());
$('leftFileInput').addEventListener('change', e => {
  if (e.target.files[0]) {
    const r = new FileReader();
    r.onload = ev => { leftInput.value = ev.target.result; computeDiff(); };
    r.readAsText(e.target.files[0]);
  }
});
$('uploadRightBtn').addEventListener('click', () => $('rightFileInput').click());
$('rightFileInput').addEventListener('change', e => {
  if (e.target.files[0]) {
    const r = new FileReader();
    r.onload = ev => { rightInput.value = ev.target.result; computeDiff(); };
    r.readAsText(e.target.files[0]);
  }
});

const diffModeBtns = document.querySelectorAll('#diffModeSelector .mode-btn');
const diffModeSlider = $('diffModeSlider');
function moveDiffSlider(btn) {
  const c = btn.closest('.mode-selector');
  const cR = c.getBoundingClientRect();
  const bR = btn.getBoundingClientRect();
  diffModeSlider.style.left = (bR.left - cR.left) + 'px';
  diffModeSlider.style.width = bR.width + 'px';
}
diffModeBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    diffModeBtns.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    moveDiffSlider(btn);
    computeDiff();
  });
});
requestAnimationFrame(() => {
  const a = document.querySelector('#diffModeSelector .mode-btn.active');
  if (a) moveDiffSlider(a);
});

$('copyDiffBtn').addEventListener('click', () => {
  const content = $('diffContent').textContent;
  navigator.clipboard.writeText(content).then(() => showToast('已复制差异结果')).catch(() => showToast('复制失败'));
});

$('exportHtmlBtn').addEventListener('click', () => {
  const left = leftInput.value;
  const right = rightInput.value;
  const html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>TextDiff Report</title><style>body{font-family:monospace;background:#1c1c1e;color:#fff;padding:20px}table{border-collapse:collapse;width:100%;font-size:13px;line-height:1.6}td{padding:3px 10px;white-space:pre-wrap;word-break:break-all;vertical-align:top}.num{color:rgba(255,255,255,0.3);text-align:right;width:40px}.add{background:rgba(52,199,89,0.15)}.del{background:rgba(255,59,48,0.15)}.eq{background:transparent}</style></head><body><h2>TextDiff Report</h2><p>Generated by TextDiff</p>${$('diffContent').innerHTML}</body></html>`;
  const blob = new Blob([html], { type: 'text/html' });
  const link = document.createElement('a');
  link.download = `textdiff_report_${Date.now()}.html`;
  link.href = URL.createObjectURL(blob);
  link.click();
  URL.revokeObjectURL(link.href);
  showToast('已导出 HTML 报告');
});

computeDiff();
</script>
</body>
</html>
