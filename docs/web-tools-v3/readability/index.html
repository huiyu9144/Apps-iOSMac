<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Readability - 文章可读性提取器 | 在线工具</title>
<meta name="description" content="免费在线文章可读性提取工具，支持粘贴文章内容或输入URL，提取文章标题/作者/正文，切换阅读主题和字体大小，导出Markdown/纯文本/PDF。" />
<meta property="og:title" content="Readability - 文章可读性提取器" />
<meta property="og:description" content="免费在线文章可读性提取工具，支持多种主题和字体，导出Markdown/纯文本/PDF。">
<meta property="og:type" content="website">
<script type="application/ld+json">
{
  "@context":"https://schema.org",
  "@type":"WebApplication",
  "name":"Readability 文章可读性提取器",
  "description":"从文章内容中提取标题、作者、正文，支持多种阅读主题和字体大小，导出Markdown/纯文本/PDF",
  "applicationCategory":"UtilitiesApplication",
  "operatingSystem":"All",
  "browserRequirements":"Requires JavaScript"
}
</script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'.SFNSDisplay','SF Pro Display','Helvetica Neue',sans-serif;background:#000000;color:#ffffff;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:32px 16px 48px;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
.header{text-align:center;margin-bottom:32px;padding:0 8px}
.header h1{font-size:30px;font-weight:700;letter-spacing:-0.5px;background:linear-gradient(135deg,#8b8bf8,#c084fc);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.header p{color:rgba(255,255,255,0.72);font-size:14px;margin-top:6px;font-weight:400;letter-spacing:0.2px}
.container{width:100%;max-width:1100px;display:flex;flex-direction:column;gap:20px}
.frost-panel{background:rgba(255,255,255,0.06);border-radius:14px;padding:20px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.mode-selector{position:relative;display:flex;background:rgba(0,0,0,0.4);border-radius:10px;padding:3px;overflow:hidden;max-width:400px}
.mode-slider{position:absolute;top:3px;left:3px;height:calc(100% - 6px);border-radius:7px;background:rgba(139,139,248,0.25);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);transition:left 0.3s cubic-bezier(0.25,0.46,0.45,0.94),width 0.3s cubic-bezier(0.25,0.46,0.45,0.94);z-index:0;pointer-events:none}
.mode-btn{flex:1;padding:8px 8px;border-radius:7px;border:none;background:transparent;color:rgba(255,255,255,0.78);font-size:12px;font-weight:500;cursor:pointer;text-align:center;font-family:inherit;position:relative;z-index:1;transition:color 0.25s ease;user-select:none}
.mode-btn.active{color:#ffffff;font-weight:600}
.control-group{display:flex;flex-direction:column;gap:6px}
.control-group label{font-size:13px;font-weight:500;color:rgba(255,255,255,0.78);letter-spacing:0.3px}
.btn{padding:12px 24px;border-radius:12px;border:none;font-size:14px;font-weight:600;cursor:pointer;transition:all 0.3s cubic-bezier(0.25,0.46,0.45,0.94);display:inline-flex;align-items:center;gap:8px;font-family:inherit;position:relative;overflow:hidden}
.btn::after{content:'';position:absolute;inset:0;background:rgba(255,255,255,0);transition:background 0.3s}
.btn:hover::after{background:rgba(255,255,255,0.06)}
.btn:active{transform:scale(0.97)}
.btn-primary{background:rgba(139,139,248,0.6);color:#fff}
.btn-primary:hover{background:rgba(139,139,248,0.7)}
.btn-success{background:rgba(52,199,89,0.55);color:#fff}
.btn-success:hover{background:rgba(52,199,89,0.65)}
.btn-secondary{background:rgba(255,255,255,0.1);color:#fff}
.btn-secondary:hover{background:rgba(255,255,255,0.14)}
.btn-outline{background:transparent;border:1.5px solid rgba(255,255,255,0.15);color:rgba(255,255,255,0.65)}
.btn-outline:hover{border-color:rgba(255,255,255,0.3);color:#ffffff}
.btn-sm{padding:7px 14px;font-size:12px;border-radius:8px}
.section-title{font-size:15px;font-weight:600;color:rgba(255,255,255,0.88);margin-bottom:10px;letter-spacing:0.2px}
textarea{background:rgba(0,0,0,0.5);border:1.5px solid rgba(255,255,255,0.1);border-radius:10px;padding:12px 14px;color:#fff;font-size:14px;outline:none;font-family:inherit;resize:vertical;width:100%;transition:border-color 0.3s}
textarea:focus{border-color:#8b8bf8;box-shadow:0 0 0 3px rgba(139,139,248,0.2)}
input[type="text"]{background:rgba(0,0,0,0.5);border:1.5px solid rgba(255,255,255,0.1);border-radius:10px;padding:11px 14px;color:#fff;font-size:14px;outline:none;font-family:inherit;width:100%;transition:border-color 0.3s}
input[type="text"]:focus{border-color:#8b8bf8;box-shadow:0 0 0 3px rgba(139,139,248,0.2)}
.row{display:grid;grid-template-columns:1fr 300px;gap:20px}
@media(max-width:860px){.row{grid-template-columns:1fr}}
@keyframes fadeSlideUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.fade-slide{animation:fadeSlideUp 0.35s cubic-bezier(0.25,0.46,0.45,0.94) both}
/* Reading area */
.reading-area{background:rgba(255,255,255,0.03);border-radius:12px;padding:24px;min-height:400px;max-height:80vh;overflow-y:auto;font-family:Georgia,'Times New Roman',serif;transition:all 0.3s}
.reading-area::-webkit-scrollbar{width:4px}
.reading-area::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:2px}
.reading-area .article-title{font-size:26px;font-weight:700;margin-bottom:4px;line-height:1.3}
.reading-area .article-meta{font-size:13px;color:rgba(255,255,255,0.5);margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,0.06)}
.reading-area .article-content{line-height:1.75;font-size:16px;color:rgba(255,255,255,0.85)}
.reading-area .article-content p{margin-bottom:14px}
.reading-area .article-content h1,.reading-area .article-content h2,.reading-area .article-content h3{margin:18px 0 10px;font-weight:600}
.reading-area .article-content img{max-width:100%;border-radius:8px;margin:12px 0}
.reading-area .article-content blockquote{border-left:3px solid #8b8bf8;padding:8px 16px;margin:12px 0;background:rgba(139,139,248,0.06);border-radius:0 8px 8px 0;color:rgba(255,255,255,0.7)}
.reading-area .article-content pre{background:rgba(0,0,0,0.3);border-radius:8px;padding:14px;overflow-x:auto;font-size:13px;margin:12px 0}
.reading-area .article-content code{font-size:0.9em;padding:2px 6px;border-radius:4px;background:rgba(255,255,255,0.06)}
.reading-area .article-content a{color:#8b8bf8;text-decoration:none}
.reading-area .article-content a:hover{text-decoration:underline}
.reading-area .article-content ul,.reading-area .article-content ol{padding-left:20px;margin:8px 0}
.reading-area .article-content li{margin:4px 0}
/* Themes */
.reading-area.theme-light{background:#f5f5f0;color:#222}
.reading-area.theme-light .article-content{color:#333}
.reading-area.theme-light .article-meta{color:rgba(0,0,0,0.4);border-bottom-color:rgba(0,0,0,0.08)}
.reading-area.theme-light .article-content blockquote{background:rgba(139,139,248,0.08)}
.reading-area.theme-light .article-content pre{background:rgba(0,0,0,0.06)}
.reading-area.theme-warm{background:#2b2b1c;color:#e8dcc8}
.reading-area.theme-warm .article-content{color:#d4c9b8}
.reading-area.theme-warm .article-meta{color:rgba(232,220,200,0.5)}
.reading-area.theme-eye{background:#1a2e1a;color:#c8e6c9}
.reading-area.theme-eye .article-content{color:#b5d6b6}
.reading-area.theme-eye .article-meta{color:rgba(200,230,201,0.5)}
/* Size classes */
.reading-area.size-sm .article-content{font-size:14px}
.reading-area.size-sm .article-title{font-size:22px}
.reading-area.size-md .article-content{font-size:16px}
.reading-area.size-md .article-title{font-size:26px}
.reading-area.size-lg .article-content{font-size:19px}
.reading-area.size-lg .article-title{font-size:30px}
.reading-area.size-xl .article-content{font-size:22px}
.reading-area.size-xl .article-title{font-size:34px}
.control-panel{display:flex;flex-direction:column;gap:12px}
.stat-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.04);font-size:13px}
.stat-row .label{color:rgba(255,255,255,0.5)}
.stat-row .value{color:rgba(255,255,255,0.88);font-variant-numeric:tabular-nums}

.toast{position:fixed;bottom:36px;left:50%;transform:translateX(-50%) translateY(80px);background:rgba(30,30,30,0.95);color:#ffffff;padding:12px 24px;border-radius:12px;font-size:14px;font-weight:500;opacity:0;transition:all 0.4s cubic-bezier(0.25,0.46,0.45,0.94);pointer-events:none;z-index:100;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 8px 32px rgba(0,0,0,0.5)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div class="header">
  <h1>Readability</h1>
  <p>文章可读性提取器 · 提取正文 · 切换主题 · 导出多种格式</p>
</div>

<div class="container">
  <div class="frost-panel">
    <div class="section-title">输入模式</div>
    <div class="mode-selector" id="inputModeSelector" style="margin-bottom:12px">
      <div class="mode-slider" id="inputModeSlider"></div>
      <button class="mode-btn active" data-imode="paste">粘贴内容</button>
      <button class="mode-btn" data-imode="url">输入 URL</button>
    </div>

    <div id="pasteArea">
      <div class="control-group">
        <label>粘贴文章内容（HTML 或纯文本）</label>
        <textarea id="contentInput" rows="6" placeholder="在此粘贴文章内容 HTML 或纯文本……&#10;&#10;提示：可直接粘贴包含 &lt;h1&gt;、&lt;p&gt; 等标签的 HTML 内容"></textarea>
      </div>
    </div>

    <div id="urlArea" style="display:none">
      <div class="control-group">
        <label>文章 URL</label>
        <div style="display:flex;gap:8px">
          <input type="text" id="urlInput" placeholder="https://example.com/article">
          <button class="btn btn-primary btn-sm" id="fetchUrlBtn">提取</button>
        </div>
        <p style="font-size:11px;color:rgba(255,255,255,0.4);margin-top:4px">注意：纯前端无法跨域，建议使用模式1粘贴内容</p>
      </div>
    </div>

    <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
      <button class="btn btn-primary" id="extractBtn">提取文章</button>
      <button class="btn btn-outline" id="clearBtn">清空</button>
    </div>
  </div>

  <div class="row">
    <div class="reading-area theme-dark size-md fade-slide" id="readingArea">
      <div style="text-align:center;color:rgba(255,255,255,0.3);padding:80px 20px;font-family:-apple-system,serif">
        <p style="font-size:16px">粘贴文章内容后点击「提取文章」</p>
        <p style="font-size:13px;margin-top:6px">支持 HTML 或纯文本格式</p>
      </div>
    </div>

    <div class="control-panel">
      <div class="frost-panel">
        <div class="section-title">阅读主题</div>
        <div class="mode-selector" id="themeSelector" style="max-width:none">
          <div class="mode-slider" id="themeSlider"></div>
          <button class="mode-btn active" data-theme="dark">深色</button>
          <button class="mode-btn" data-theme="light">浅色</button>
          <button class="mode-btn" data-theme="warm">暖色</button>
          <button class="mode-btn" data-theme="eye">护眼</button>
        </div>
      </div>

      <div class="frost-panel">
        <div class="section-title">字体大小</div>
        <div class="mode-selector" id="sizeSelector" style="max-width:none">
          <div class="mode-slider" id="sizeSlider"></div>
          <button class="mode-btn active" data-size="sm">小</button>
          <button class="mode-btn" data-size="md">中</button>
          <button class="mode-btn" data-size="lg">大</button>
          <button class="mode-btn" data-size="xl">特大</button>
        </div>
      </div>

      <div class="frost-panel">
        <div class="section-title">文章统计</div>
        <div class="stat-row"><span class="label">字数</span><span class="value" id="statWords">0</span></div>
        <div class="stat-row"><span class="label">阅读时间</span><span class="value" id="statReadTime">0 分钟</span></div>
        <div class="stat-row"><span class="label">段落数</span><span class="value" id="statParagraphs">0</span></div>
      </div>

      <div class="frost-panel">
        <div class="section-title">导出</div>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          <button class="btn btn-sm btn-secondary" id="exportMarkdown">Markdown</button>
          <button class="btn btn-sm btn-secondary" id="exportText">纯文本</button>
          <button class="btn btn-sm btn-success" id="exportPdf">PDF (打印)</button>
        </div>
        <div style="margin-top:8px">
          <button class="btn btn-sm btn-outline" id="copyContentBtn" style="width:100%;justify-content:center">复制文章内容</button>
        </div>
      </div>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
let toastTimer = null;
const $ = id => document.getElementById(id);

function showToast(msg) {
  const el = $('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2400);
}

let currentArticle = { title: '', author: '', content: '', html: '' };

/* Input mode switch */
const imodeBtns = document.querySelectorAll('#inputModeSelector .mode-btn');
const imodeSlider = $('inputModeSlider');
function moveImodeSlider(btn) {
  const c = btn.closest('.mode-selector');
  const cRect = c.getBoundingClientRect();
  const bRect = btn.getBoundingClientRect();
  imodeSlider.style.left = (bRect.left - cRect.left) + 'px';
  imodeSlider.style.width = bRect.width + 'px';
}
imodeBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    imodeBtns.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    moveImodeSlider(btn);
    const mode = btn.dataset.imode;
    $('pasteArea').style.display = mode === 'paste' ? 'block' : 'none';
    $('urlArea').style.display = mode === 'url' ? 'block' : 'none';
  });
});
requestAnimationFrame(() => {
  const a = document.querySelector('#inputModeSelector .mode-btn.active');
  if (a) moveImodeSlider(a);
});

/* Theme switch */
const themeBtns = document.querySelectorAll('#themeSelector .mode-btn');
const themeSlider = $('themeSlider');
function moveThemeSlider(btn) {
  const c = btn.closest('.mode-selector');
  const cRect = c.getBoundingClientRect();
  const bRect = btn.getBoundingClientRect();
  themeSlider.style.left = (bRect.left - cRect.left) + 'px';
  themeSlider.style.width = bRect.width + 'px';
}
themeBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    themeBtns.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    moveThemeSlider(btn);
    const ra = $('readingArea');
    ra.className = ra.className.replace(/theme-\w+/g, '').trim();
    ra.classList.add('theme-' + btn.dataset.theme);
  });
});
requestAnimationFrame(() => {
  const a = document.querySelector('#themeSelector .mode-btn.active');
  if (a) moveThemeSlider(a);
});

/* Size switch */
const sizeBtns = document.querySelectorAll('#sizeSelector .mode-btn');
const sizeSlider = $('sizeSlider');
function moveSizeSlider(btn) {
  const c = btn.closest('.mode-selector');
  const cRect = c.getBoundingClientRect();
  const bRect = btn.getBoundingClientRect();
  sizeSlider.style.left = (bRect.left - cRect.left) + 'px';
  sizeSlider.style.width = bRect.width + 'px';
}
sizeBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    sizeBtns.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    moveSizeSlider(btn);
    const ra = $('readingArea');
    ra.className = ra.className.replace(/size-\w+/g, '').trim();
    ra.classList.add('size-' + btn.dataset.size);
  });
});
requestAnimationFrame(() => {
  const a = document.querySelector('#sizeSelector .mode-btn.active');
  if (a) moveSizeSlider(a);
});

/* Extract */
function extractArticle() {
  const raw = $('contentInput').value.trim();
  if (!raw) { showToast('请粘贴文章内容'); return; }

  let title = '';
  let author = '';
  let contentHtml = '';
  let contentText = raw;

  // Try parsing as HTML
  const parser = new DOMParser();
  const doc = parser.parseFromString(raw, 'text/html');
  const hasHtml = doc.body && doc.body.children.length > 0 && !raw.startsWith(' ');

  if (hasHtml && doc.body.innerHTML !== raw) {
    // Extract title
    const h1 = doc.querySelector('h1');
    if (h1) title = h1.textContent.trim();
    else {
      const h2 = doc.querySelector('h2');
      if (h2) title = h2.textContent.trim();
    }

    // Try meta author
    const metaAuthor = doc.querySelector('meta[name="author"]');
    if (metaAuthor) author = metaAuthor.content;

    // Try byline
    if (!author) {
      const byline = doc.querySelector('.byline, .author, [rel="author"]');
      if (byline) author = byline.textContent.trim();
    }

    // Try time
    if (!author) {
      const timeEl = doc.querySelector('time');
      if (timeEl) author = timeEl.textContent.trim();
    }

    contentHtml = doc.body.innerHTML;
    contentText = doc.body.textContent.trim();
  } else {
    // Plain text - try to detect title from first non-empty line
    const lines = raw.split('\n').filter(l => l.trim());
    if (lines.length > 0) {
      title = lines[0].trim();
      if (title.length > 80) title = '';
    }
    contentText = raw;
    contentHtml = raw.split('\n').filter(l => l.trim()).map(l => `<p>${escHtml(l)}</p>`).join('\n');
  }

  if (!title) title = '无标题文章';
  contentText = contentText.replace(/\s+/g, ' ').trim();

  currentArticle = { title, author, content: contentText, html: contentHtml };
  renderArticle();
  updateStats();
}

function renderArticle() {
  const ra = $('readingArea');
  const authorLine = currentArticle.author ? ` · ${escHtml(currentArticle.author)}` : '';
  ra.innerHTML = `
    <div class="article-title">${escHtml(currentArticle.title)}</div>
    <div class="article-meta">${currentArticle.content.length} 字${authorLine}</div>
    <div class="article-content">${currentArticle.html}</div>
  `;
  showToast('文章已提取');
}

function updateStats() {
  const text = currentArticle.content;
  const wordCount = text.length;
  const readTime = Math.max(1, Math.ceil(wordCount / 300));
  const paras = text.split('\n').filter(l => l.trim()).length;

  $('statWords').textContent = wordCount.toLocaleString();
  $('statReadTime').textContent = readTime + ' 分钟';
  $('statParagraphs').textContent = paras;
}

function escHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

$('extractBtn').addEventListener('click', extractArticle);
$('clearBtn').addEventListener('click', () => {
  $('contentInput').value = '';
  $('urlInput').value = '';
  currentArticle = { title: '', author: '', content: '', html: '' };
  $('readingArea').innerHTML = '<div style="text-align:center;color:rgba(255,255,255,0.3);padding:80px 20px;font-family:-apple-system,serif"><p style="font-size:16px">粘贴文章内容后点击「提取文章」</p><p style="font-size:13px;margin-top:6px">支持 HTML 或纯文本格式</p></div>';
  $('statWords').textContent = '0';
  $('statReadTime').textContent = '0 分钟';
  $('statParagraphs').textContent = '0';
});

$('fetchUrlBtn').addEventListener('click', () => {
  showToast('纯前端无法跨域获取 URL 内容，请使用「粘贴内容」模式');
});

/* Export */
$('exportMarkdown').addEventListener('click', () => {
  if (!currentArticle.content) { showToast('请先提取文章'); return; }
  let md = `# ${currentArticle.title}\n\n`;
  if (currentArticle.author) md += `> 作者：${currentArticle.author}\n\n`;
  md += currentArticle.content + '\n';
  const blob = new Blob([md], {type:'text/markdown'});
  const a = document.createElement('a');
  a.download = (currentArticle.title || 'article') + '.md';
  a.href = URL.createObjectURL(blob);
  a.click();
  URL.revokeObjectURL(a.href);
  showToast('已导出 Markdown');
});

$('exportText').addEventListener('click', () => {
  if (!currentArticle.content) { showToast('请先提取文章'); return; }
  let txt = `${currentArticle.title}\n${'='.repeat(currentArticle.title.length)}\n\n`;
  if (currentArticle.author) txt += `作者：${currentArticle.author}\n\n`;
  txt += currentArticle.content;
  const blob = new Blob([txt], {type:'text/plain'});
  const a = document.createElement('a');
  a.download = (currentArticle.title || 'article') + '.txt';
  a.href = URL.createObjectURL(blob);
  a.click();
  URL.revokeObjectURL(a.href);
  showToast('已导出纯文本');
});

$('exportPdf').addEventListener('click', () => {
  if (!currentArticle.content) { showToast('请先提取文章'); return; }
  window.print();
});

$('copyContentBtn').addEventListener('click', () => {
  if (!currentArticle.content) { showToast('请先提取文章'); return; }
  const text = `# ${currentArticle.title}\n\n${currentArticle.content}`;
  if (navigator.clipboard) navigator.clipboard.writeText(text);
  else { const ta = document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
  showToast('文章内容已复制');
});
</script>
</body>
</html>
