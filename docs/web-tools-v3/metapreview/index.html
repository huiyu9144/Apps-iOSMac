<script>
const $ = id => document.getElementById(id);
const toastEl = $('toast');
let toastTimer = null;

function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2400);
}

function escHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function parseOG(html) {
  const doc = document.createElement('html');
  doc.innerHTML = html;
  const metaTags = doc.querySelectorAll('meta');
  const og = {};
  const twitter = {};
  const basics = { title: '', description: '', image: '' };

  metaTags.forEach(m => {
    const prop = m.getAttribute('property') || m.getAttribute('name') || '';
    const content = m.getAttribute('content') || '';
    if (prop.startsWith('og:')) {
      og[prop.replace('og:', '')] = content;
      if (prop === 'og:title') basics.title = content;
      if (prop === 'og:description') basics.description = content;
      if (prop === 'og:image') basics.image = content;
    }
    if (prop.startsWith('twitter:')) {
      twitter[prop.replace('twitter:', '')] = content;
      if (!basics.title && prop === 'twitter:title') basics.title = content;
      if (!basics.description && prop === 'twitter:description') basics.description = content;
      if (!basics.image && prop === 'twitter:image') basics.image = content;
    }
    if (prop === 'title') basics.title = content;
    if (prop === 'description') basics.description = content;
  });

  const titleTag = doc.querySelector('title');
  if (titleTag && !basics.title) basics.title = titleTag.textContent;

  const linkIcon = doc.querySelector('link[rel="icon"], link[rel="shortcut icon"]');
  if (linkIcon && !basics.image) basics.image = linkIcon.getAttribute('href') || '';

  return { og, twitter, basics };
}

function buildSocialCards(data) {
  const { og, twitter, basics } = data;
  const title = basics.title || og.title || twitter.title || '未设置标题';
  const desc = basics.description || og.description || twitter.description || '未设置描述';
  const image = basics.image || og.image || twitter.image || '';
  const domain = og.url ? new URL(og.url).hostname : 'example.com';

  const imgTag = image
    ? `<img class="card-img" src="${escHtml(image)}" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="card-img-placeholder" style="display:none">图片加载失败</div>`
    : '<div class="card-img-placeholder">无 OG Image</div>';

  return `
    <div class="social-card">
      <div class="card-header">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="#1da1f2"><path d="M23.643 4.937c-.835.37-1.732.62-2.675.733.962-.576 1.7-1.49 2.048-2.578-.9.534-1.897.922-2.958 1.13-.85-.904-2.06-1.47-3.4-1.47-2.572 0-4.658 2.086-4.658 4.66 0 .364.042.718.12 1.06-3.873-.195-7.304-2.05-9.602-4.868-.4.69-.63 1.49-.63 2.342 0 1.616.823 3.043 2.072 3.878-.764-.025-1.482-.234-2.11-.583v.06c0 2.257 1.605 4.14 3.737 4.568-.392.106-.803.162-1.227.162-.3 0-.593-.028-.877-.082.593 1.85 2.313 3.198 4.352 3.234-1.595 1.25-3.604 1.995-5.786 1.995-.376 0-.747-.022-1.112-.065 2.062 1.323 4.51 2.093 7.14 2.093 8.57 0 13.255-7.098 13.255-13.254 0-.2-.005-.402-.014-.602.91-.658 1.7-1.477 2.323-2.41z"/></svg>
        Twitter / X
      </div>
      <div class="card-body">
        ${imgTag}
        <div class="card-title">${escHtml(title)}</div>
        <div class="card-desc">${escHtml(desc)}</div>
        <div class="card-domain">${escHtml(domain)}</div>
      </div>
    </div>

    <div class="social-card">
      <div class="card-header">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="#1877f2"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
        Facebook
      </div>
      <div class="card-body" style="padding:0">
        ${image ? `<img class="card-img" src="${escHtml(image)}" alt="" onerror="this.style.display='none'" style="height:180px">` : '<div class="card-img-placeholder">无 OG Image</div>'}
        <div style="padding:10px 14px 14px">
          <div class="card-domain" style="margin:0 0 2px">${escHtml(domain)}</div>
          <div class="card-title" style="margin:0 0 2px">${escHtml(title)}</div>
          <div class="card-desc">${escHtml(desc)}</div>
        </div>
      </div>
    </div>

    <div class="social-card">
      <div class="card-header">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="#0a66c2"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
        LinkedIn
      </div>
      <div class="card-body" style="padding:0">
        ${image ? `<img class="card-img" src="${escHtml(image)}" alt="" onerror="this.style.display='none'" style="height:140px">` : '<div class="card-img-placeholder">无 OG Image</div>'}
        <div style="padding:10px 14px 12px">
          <div class="card-title" style="margin:0 0 2px;font-size:13px">${escHtml(title)}</div>
          <div class="card-desc">${escHtml(desc)}</div>
          <div class="card-domain">${escHtml(domain)}</div>
        </div>
      </div>
    </div>

    <div class="social-card">
      <div class="card-header">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="#611f69"><path d="M12 2C6.477 2 2 6.477 2 12s4.477 10 10 10 10-4.477 10-10S17.523 2 12 2zm5.5 13.5h-11v-2h11v2zm0-4h-11v-2h11v2zm0-4h-11v-2h11v2z"/></svg>
        Slack
      </div>
      <div class="card-body" style="padding:0;display:flex;gap:0">
        ${image ? `<div style="width:80px;min-height:80px;flex-shrink:0;background-image:url(${escHtml(image)});background-size:cover;background-position:center"></div>` : '<div style="width:80px;min-height:80px;flex-shrink:0;background:#e5e5ea;display:flex;align-items:center;justify-content:center;font-size:10px;color:#8e8e93">No Image</div>'}
        <div style="padding:10px 12px;flex:1">
          <div class="card-title" style="margin:0 0 2px;font-size:13px">${escHtml(title)}</div>
          <div class="card-desc">${escHtml(desc)}</div>
          <div class="card-domain">${escHtml(domain)}</div>
        </div>
      </div>
    </div>
  `;
}

function buildSEOAnalysis(data) {
  const { og, twitter } = data;
  const checks = [
    { key: 'og:title', label: 'og:title', value: og.title, required: true },
    { key: 'og:description', label: 'og:description', value: og.description, required: true },
    { key: 'og:image', label: 'og:image', value: og.image, required: true },
    { key: 'og:url', label: 'og:url', value: og.url, required: false },
    { key: 'og:type', label: 'og:type', value: og.type || 'website', required: false },
    { key: 'twitter:card', label: 'twitter:card', value: twitter.card, required: true },
    { key: 'twitter:title', label: 'twitter:title', value: twitter.title, required: false },
    { key: 'twitter:description', label: 'twitter:description', value: twitter.description, required: false },
    { key: 'twitter:image', label: 'twitter:image', value: twitter.image, required: false },
    { key: 'title', label: '<title> Tag', value: data.basics.title, required: true },
  ];

  let html = '<div class="seo-check">';
  let missingCount = 0;

  checks.forEach(c => {
    const hasValue = c.value && c.value.trim();
    let status, icon;
    if (hasValue) {
      if (c.required || c.value) { status = 'ok'; icon = '✓'; }
      else { status = 'warn'; icon = '!'; }
    } else {
      status = c.required ? 'missing' : 'warn';
      icon = c.required ? '✕' : '!';
      if (c.required) missingCount++;
    }
    html += `<div class="seo-item">
      <div class="status ${status}">${icon}</div>
      <span class="label">${c.label}</span>
      <span class="value">${hasValue ? escHtml(c.value.substring(0, 60)) : (c.required ? '缺失' : '可选')}</span>
    </div>`;
  });

  const score = Math.max(0, Math.round(100 - (missingCount / checks.length) * 100));
  html += `<div class="seo-item" style="margin-top:4px;background:rgba(139,139,248,0.08)">
    <div class="status ${score >= 70 ? 'ok' : 'warn'}" style="border-radius:4px;width:auto;padding:2px 8px">${score}分</div>
    <span style="color:rgba(255,255,255,0.72);font-size:12px">${score >= 70 ? 'SEO 状态良好' : '建议补充缺失的 OG 标签'}</span>
  </div>`;

  html += '</div>';
  return html;
}

function parseAndPreview() {
  const html = $('htmlInput').value.trim();
  if (!html) { showToast('请输入 HTML 内容'); return; }

  const data = parseOG(html);

  $('socialPreviews').innerHTML = buildSocialCards(data);
  $('seoResults').innerHTML = buildSEOAnalysis(data);

  saveHistory(html, data);
}

function saveHistory(html, data) {
  let history = JSON.parse(localStorage.getItem('metapreview_history') || '[]');
  const entry = {
    id: Date.now(),
    time: new Date().toLocaleString(),
    title: data.basics.title || data.og.title || '未命名',
    html: html.substring(0, 500),
  };
  history.unshift(entry);
  if (history.length > 10) history = history.slice(0, 10);
  localStorage.setItem('metapreview_history', JSON.stringify(history));
  renderHistory();
}

function renderHistory() {
  const list = $('historyList');
  const empty = $('historyEmpty');
  const history = JSON.parse(localStorage.getItem('metapreview_history') || '[]');
  if (history.length === 0) {
    list.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';
  list.innerHTML = history.map(h =>
    `<div class="history-item" data-id="${h.id}">
      <span>${escHtml(h.title)}</span>
      <span class="time">${h.time}</span>
    </div>`
  ).join('');

  list.querySelectorAll('.history-item').forEach(el => {
    el.addEventListener('click', () => {
      const history = JSON.parse(localStorage.getItem('metapreview_history') || '[]');
      const item = history.find(h => h.id === parseInt(el.dataset.id));
      if (item) {
        $('htmlInput').value = item.html;
        parseAndPreview();
      }
    });
  });
}

$('parseBtn').addEventListener('click', parseAndPreview);

$('loadSampleBtn').addEventListener('click', () => {
  $('htmlInput').value = `<!DOCTYPE html>
<html>
<head>
