<div class="header">

<script>
const $ = id => document.getElementById(id);
const toastEl = $('toast');
let toastTimer = null;

function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2400);
}

function escHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

let currentData = [];
let currentHeaders = [];
let sortKey = null;
let sortDir = 1;

function detectSep(text) {
  const auto = document.querySelector('input[name="sep"]:checked');
  if (auto && auto.value !== 'auto') {
    if (auto.value === '\\t') return '\t';
    return auto.value;
  }
  const firstLine = text.split('\n')[0] || '';
  const comma = (firstLine.match(/,/g) || []).length;
  const tab = (firstLine.match(/\t/g) || []).length;
  const semi = (firstLine.match(/;/g) || []).length;
  if (tab > comma && tab > semi) return '\t';
  if (semi > comma && semi > tab) return ';';
  return ',';
}

function parseCSV(text, sep) {
  const lines = text.split('\n').filter(l => l.trim());
  if (lines.length < 1) return { headers: [], rows: [] };
  const headers = lines[0].split(sep).map(h => h.trim());
  const rows = [];
  for (let i = 1; i < lines.length; i++) {
    const cells = lines[i].split(sep).map(c => c.trim());
    if (cells.length === 1 && cells[0] === '') continue;
    const row = {};
    headers.forEach((h, idx) => { row[h] = cells[idx] || ''; });
    rows.push(row);
  }
  return { headers, rows };
}

function parseJSON(text) {
  try {
    const data = JSON.parse(text);
    const arr = Array.isArray(data) ? data : [data];
    if (arr.length === 0) return { headers: [], rows: [] };
    const headers = Object.keys(arr[0]);
    const rows = arr.map(obj => {
      const row = {};
      headers.forEach(h => { row[h] = obj[h] !== undefined ? String(obj[h]) : ''; });
      return row;
    });
    return { headers, rows };
  } catch(e) {
    return null;
  }
}

function parseData() {
  const text = $('dataInput').value.trim();
  if (!text) { showToast('请粘贴数据或上传文件'); return; }

  let jsonResult = parseJSON(text);
  if (jsonResult) {
    currentHeaders = jsonResult.headers;
    currentData = jsonResult.rows;
  } else {
    const sep = detectSep(text);
    const result = parseCSV(text, sep);
    currentHeaders = result.headers;
    currentData = result.rows;
  }

  if (currentHeaders.length === 0) { showToast('未解析到数据'); return; }

  sortKey = null;
  sortDir = 1;
  renderTable();
  renderStats();
  $('tablePanel').style.display = 'block';
  $('statsPanel').style.display = 'block';
}

function renderTable() {
  const wrap = $('tableWrap');
  const info = $('tableInfo');
  const searchVal = $('searchInput').value.toLowerCase();

  let filtered = currentData;
  if (searchVal) {
    filtered = currentData.filter(row =>
      currentHeaders.some(h => (row[h] || '').toLowerCase().includes(searchVal))
    );
  }

  if (sortKey) {
    filtered = [...filtered].sort((a, b) => {
      const va = (a[sortKey] || ''), vb = (b[sortKey] || '');
      const na = parseFloat(va), nb = parseFloat(vb);
      if (!isNaN(na) && !isNaN(nb)) return (na - nb) * sortDir;
      return va.localeCompare(vb) * sortDir;
    });
  }

  info.textContent = `(${filtered.length} 条记录，共 ${currentData.length} 条)`;

  if (filtered.length === 0) {
    wrap.innerHTML = '<div style="text-align:center;padding:40px;color:rgba(255,255,255,0.48);font-size:13px">无匹配数据</div>';
    return;
  }

  let html = '<table class="data-table"><thead><tr>';
  currentHeaders.forEach(h => {
    const arrow = sortKey === h ? (sortDir === 1 ? ' ▲' : ' ▼') : ' ⇅';
    const cls = sortKey === h ? 'active' : '';
    html += `<th data-key="${escHtml(h)}">${escHtml(h)}<span class="sort-arrow ${cls}">${arrow}</span></th>`;
  });
  html += '</tr></thead><tbody>';
  filtered.forEach(row => {
    html += '<tr>';
    currentHeaders.forEach(h => {
      html += `<td title="${escHtml(row[h] || '')}">${escHtml((row[h] || '').substring(0, 120))}</td>`;
    });
    html += '</tr>';
  });
  html += '</tbody></table>';
  wrap.innerHTML = html;

  wrap.querySelectorAll('th').forEach(th => {
    th.addEventListener('click', () => {
      const key = th.dataset.key;
      if (sortKey === key) sortDir *= -1;
      else { sortKey = key; sortDir = 1; }
      renderTable();
    });
  });
}

function renderStats() {
  const grid = $('statsGrid');
  const totalRows = currentData.length;
  const totalCols = currentHeaders.length;

  let html = `
    <div class="stat-card"><div class="stat-label">总行数</div><div class="stat-value purple">${totalRows}</div></div>
    <div class="stat-card"><div class="stat-label">总列数</div><div class="stat-value purple">${totalCols}</div></div>
  `;

  currentHeaders.forEach(h => {
    const values = currentData.map(r => r[h] || '');
    const nonEmpty = values.filter(v => v.trim());
    const emptyRate = totalRows > 0 ? Math.round(((totalRows - nonEmpty.length) / totalRows) * 100) : 0;
    const nums = values.map(v => parseFloat(v)).filter(v => !isNaN(v));
    const type = nums.length > totalRows * 0.7 ? 'Number' : 'Text';
    html += `
      <div class="stat-card">
        <div class="stat-label">${escHtml(h)}</div>
        <div class="stat-value" style="font-size:14px">${type} · 空值 ${emptyRate}%</div>
      </div>
    `;
  });

  grid.innerHTML = html;
}

$('parseBtn').addEventListener('click', parseData);

$('loadSampleBtn').addEventListener('click', () => {
  $('dataInput').value = `name,email,age,country,score
Alice Johnson,alice@example.com,28,USA,92.5
Bob Smith,bob@test.com,35,UK,87.3
Charlie Brown,charlie@mail.com,42,Canada,91.8
Diana Prince,diana@web.org,31,Germany,95.1
Eve Williams,eve@demo.com,26,Australia,88.6
Frank Miller,frank@sample.com,39,France,84.2
Grace Lee,grace@test.org,33,South Korea,93.7
Henry Davis,henry@mail.com,45,UK,79.4
Iris Chen,iris@web.com,29,Taiwan,90.0
Jack Wilson,jack@demo.org,37,Ireland,86.5`;
  parseData();
});

const csvUploadArea = $('csvUploadArea');
const csvFileInput = $('csvFileInput');
csvUploadArea.addEventListener('click', () => csvFileInput.click());
csvFileInput.addEventListener('change', e => {
  if (e.target.files[0]) {
    const r = new FileReader();
    r.onload = ev => {
      $('dataInput').value = ev.target.result;
      parseData();
    };
    r.readAsText(e.target.files[0]);
  }
});
csvUploadArea.addEventListener('dragover', e => { e.preventDefault(); csvUploadArea.classList.add('dragover'); });
csvUploadArea.addEventListener('dragleave', () => csvUploadArea.classList.remove('dragover'));
csvUploadArea.addEventListener('drop', e => {
  e.preventDefault();
  csvUploadArea.classList.remove('dragover');
  if (e.dataTransfer.files.length > 0) {
    const r = new FileReader();
    r.onload = ev => {
      $('dataInput').value = ev.target.result;
      parseData();
    };
    r.readAsText(e.dataTransfer.files[0]);
  }
});

document.querySelectorAll('input[name="sep"]').forEach(el => {
  el.addEventListener('change', () => {
    if ($('dataInput').value.trim()) parseData();
  });
});

$('searchInput').addEventListener('input', () => {
  if (currentHeaders.length > 0) renderTable();
});

$('exportJsonBtn').addEventListener('click', () => {
  if (currentData.length === 0) { showToast('无数据可导出'); return; }
  const json = JSON.stringify(currentData, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const link = document.createElement('a');
  link.download = 'data_export.json';
  link.href = URL.createObjectURL(blob);
  link.click();
  URL.revokeObjectURL(link.href);
  showToast('已导出 JSON');
});

$('exportMarkdownBtn').addEventListener('click', () => {
  if (currentData.length === 0) { showToast('无数据可导出'); return; }
  let md = '| ' + currentHeaders.join(' | ') + ' |\n';
  md += '| ' + currentHeaders.map(() => '---').join(' | ') + ' |\n';
  currentData.forEach(row => {
    md += '| ' + currentHeaders.map(h => (row[h] || '').replace(/\|/g, '\\|')).join(' | ') + ' |\n';
  });
  const blob = new Blob([md], { type: 'text/markdown' });
  const link = document.createElement('a');
  link.download = 'data_export.md';
  link.href = URL.createObjectURL(blob);
  link.click();
  URL.revokeObjectURL(link.href);
  showToast('已导出 Markdown');
});

$('exportHtmlBtn').addEventListener('click', () => {
  if (currentData.length === 0) { showToast('无数据可导出'); return; }
  let html = '<table border="1" cellpadding="6" cellspacing="0" style="border-collapse:collapse;width:100%;font-family:sans-serif;font-size:13px">';
  html += '<thead><tr>' + currentHeaders.map(h => `<th style="background:#f0f0f0;text-align:left">${escHtml(h)}</th>`).join('') + '</tr></thead><tbody>';
  currentData.forEach(row => {
    html += '<tr>' + currentHeaders.map(h => `<td style="border-bottom:1px solid #ddd">${escHtml(row[h] || '')}</td>`).join('') + '</tr>';
  });
  html += '</tbody></table>';
  const blob = new Blob([html], { type: 'text/html' });
  const link = document.createElement('a');
  link.download = 'data_export.html';
  link.href = URL.createObjectURL(blob);
  link.click();
  URL.revokeObjectURL(link.href);
  showToast('已导出 HTML 表格');
});

$('dataInput').addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) parseData();
});
</script>
</body>
</html>
