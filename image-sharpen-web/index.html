<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Image Sharpen</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue',sans-serif;
  background:#000;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;
  padding:32px 16px 48px;-webkit-font-smoothing:antialiased
}
.header{text-align:center;margin-bottom:32px;padding:0 8px}
.header h1{font-size:30px;font-weight:700;letter-spacing:-.5px;background:linear-gradient(135deg,#5ac8fa,#8b8bf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.header p{color:rgba(255,255,255,.72);font-size:14px;margin-top:6px;font-weight:400;letter-spacing:.2px}
.container{width:100%;max-width:960px;display:flex;flex-direction:column;gap:20px}

/* Upload */
.upload-area{border:1.5px dashed rgba(255,255,255,.15);border-radius:14px;padding:28px 20px;text-align:center;cursor:pointer;transition:all .35s;background:rgba(255,255,255,.04);backdrop-filter:blur(2px)}
.upload-area:hover{border-color:rgba(90,200,250,.5);background:rgba(90,200,250,.06)}
.upload-area.dragover{border-color:#5ac8fa;background:rgba(90,200,250,.1);transform:scale(1.01)}
.upload-icon{width:34px;height:34px;margin:0 auto 8px;color:#5ac8fa}
.upload-area p{color:rgba(255,255,255,.88);font-size:14px;font-weight:400}
.upload-area .hint{font-size:12px;color:rgba(255,255,255,.56);margin-top:4px}

/* Image List */
.image-list-section{background:rgba(255,255,255,.06);border-radius:14px;overflow:hidden;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);animation:fadeSlideUp .35s both}
.image-list-header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;font-size:13px;font-weight:500;color:rgba(255,255,255,.78);border-bottom:1px solid rgba(255,255,255,.06)}
.image-list-header .count{color:#5ac8fa;font-weight:600}
.image-list-body{display:flex;flex-wrap:wrap;gap:8px;padding:12px 14px;max-height:192px;overflow-y:auto;align-content:flex-start}
.image-list-body::-webkit-scrollbar{width:4px}
.image-list-body::-webkit-scrollbar-track{background:transparent}
.image-list-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:2px}
.image-item{display:flex;flex-direction:column;align-items:center;gap:5px;padding:6px 6px 8px;border-radius:10px;cursor:pointer;transition:all .25s;flex-shrink:0;width:108px;position:relative;background:transparent}
.image-item:hover{background:rgba(255,255,255,.05);transform:translateY(-1px)}
.image-item.active{background:rgba(90,200,250,.12);outline:1.5px solid rgba(90,200,250,.35)}
.image-item-thumb{width:92px;height:68px;border-radius:8px;object-fit:cover;background:rgba(255,255,255,.04);flex-shrink:0;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.image-item-info{width:100%;text-align:center;min-width:0}
.image-item-name{font-size:10px;color:rgba(255,255,255,.7);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:400;letter-spacing:.2px}
.image-item-dims{font-size:9px;color:rgba(255,255,255,.3);margin-top:1px;font-variant-numeric:tabular-nums}
.image-item-remove{position:absolute;top:1px;right:1px;width:20px;height:20px;border-radius:50%;border:none;background:rgba(0,0,0,.55);color:#fff;cursor:pointer;font-size:11px;display:none;align-items:center;justify-content:center;transition:all .2s;backdrop-filter:blur(4px);z-index:2}
.image-item:hover .image-item-remove{display:flex}
.image-item-remove:hover{background:rgba(255,69,58,.8);transform:scale(1.1)}

/* Controls */
.controls-card{background:rgba(255,255,255,.06);border-radius:14px;padding:20px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);animation:fadeSlideUp .35s both}
.sec-title{font-size:13px;font-weight:500;color:rgba(255,255,255,.78);letter-spacing:.3px;margin-bottom:10px}
.method-grid{display:flex;gap:6px;margin-bottom:12px}
.method-btn{flex:1;padding:9px 4px;border-radius:8px;border:1.5px solid rgba(255,255,255,.08);background:rgba(0,0,0,.3);color:rgba(255,255,255,.5);font-size:11px;font-weight:500;cursor:pointer;transition:all .25s;font-family:inherit;text-align:center}
.method-btn:hover{border-color:rgba(90,200,250,.3);color:rgba(255,255,255,.8)}
.method-btn.active{background:rgba(90,200,250,.2);border-color:rgba(90,200,250,.4);color:#fff;font-weight:600}
.method-desc{font-size:11px;color:rgba(255,255,255,.4);line-height:1.5;margin-bottom:6px;min-height:32px}
.presets-wrap{overflow-x:auto;margin-bottom:14px;padding-bottom:2px}
.presets-wrap::-webkit-scrollbar{height:3px}
.presets-wrap::-webkit-scrollbar-track{background:transparent}
.presets-wrap::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:2px}
.preset-row{display:flex;gap:6px}
.preset-chip{flex-shrink:0;padding:5px 10px;border-radius:7px;border:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.03);color:rgba(255,255,255,.5);font-size:11px;font-weight:500;cursor:pointer;transition:all .2s;font-family:inherit;white-space:nowrap;letter-spacing:.2px}
.preset-chip:hover{border-color:rgba(90,200,250,.3);color:rgba(255,255,255,.8);background:rgba(90,200,250,.06)}
.preset-chip:active{transform:scale(.96)}
.slider-group{display:flex;flex-direction:column;gap:3px;margin-bottom:10px}
.slider-group label{font-size:12px;color:rgba(255,255,255,.5)}
.slider-row{display:flex;align-items:center;gap:10px}
.slider-row input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:4px;background:rgba(255,255,255,.1);border-radius:2px;outline:none;transition:background .2s}
.slider-row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#5ac8fa;cursor:pointer;border:2px solid rgba(255,255,255,.2);transition:transform .15s}
.slider-row input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.15)}
.slider-val{width:32px;text-align:right;font-size:12px;color:rgba(255,255,255,.6);font-family:'SF Mono','Consolas',monospace}
.int-slider{width:24px;text-align:right;font-size:12px;color:rgba(255,255,255,.6);font-family:'SF Mono','Consolas',monospace}

/* Preview */
.preview-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;animation:fadeSlideUp .35s both}
.preview-card{background:rgba(255,255,255,.06);border-radius:14px;overflow:hidden;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.preview-header{display:flex;justify-content:space-between;align-items:center;padding:13px 16px;font-size:13px;font-weight:500;color:rgba(255,255,255,.78);border-bottom:1px solid rgba(255,255,255,.06)}
.preview-header .dim{color:rgba(255,255,255,.4);font-weight:400;font-size:12px}
.preview-canvas-wrap{display:flex;align-items:center;justify-content:center;min-height:260px;padding:14px;background:repeating-conic-gradient(rgba(255,255,255,.04) 0% 25%,rgba(255,255,255,.08) 0% 50%) 0 0 / 18px 18px}
.preview-canvas-wrap canvas{max-width:100%;max-height:380px;border-radius:6px;display:block;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.preview-placeholder{color:rgba(255,255,255,.48);font-size:13px;text-align:center;padding:60px 20px}
.status-bar{display:none;align-items:center;gap:10px;padding:12px 16px;border-top:1px solid rgba(255,255,255,.06);font-size:12px;color:rgba(255,255,255,.5)}
.status-bar.show{display:flex}
.spinner{width:16px;height:16px;border:2px solid rgba(90,200,250,.2);border-top-color:#5ac8fa;border-radius:50%;animation:spin .8s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}

/* Progress */
.progress-wrap{display:none;width:100%}
.progress-wrap.show{display:block;animation:fadeSlideUp .3s both}
.progress-bar-track{width:100%;height:4px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden}
.progress-bar-fill{height:100%;background:linear-gradient(90deg,#5ac8fa,#8b8bf8);border-radius:2px;width:0%;transition:width .3s}
.progress-label{display:flex;justify-content:space-between;font-size:11px;color:rgba(255,255,255,.56);margin-top:6px}

/* Actions */
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;animation:fadeSlideUp .35s both}
.btn{padding:12px 24px;border-radius:12px;border:none;font-size:14px;font-weight:600;cursor:pointer;transition:all .3s;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;font-family:inherit;letter-spacing:.3px;position:relative;overflow:hidden}
.btn::after{content:'';position:absolute;inset:0;background:rgba(255,255,255,0);transition:background .3s}
.btn:hover::after{background:rgba(255,255,255,.06)}
.btn:active{transform:scale(.97)}
.btn-primary{background:rgba(90,200,250,.6);color:#fff}
.btn-primary:hover{background:rgba(90,200,250,.7)}
.btn-primary:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn-secondary{background:rgba(255,255,255,.1);color:#fff}
.btn-secondary:hover{background:rgba(255,255,255,.14)}
.btn-outline{background:transparent;border:1.5px solid rgba(255,255,255,.15);color:rgba(255,255,255,.65)}
.btn-outline:hover{border-color:rgba(255,255,255,.3);color:#fff}

.toast{position:fixed;bottom:36px;left:50%;transform:translateX(-50%) translateY(80px);background:rgba(30,30,30,.95);color:#fff;padding:12px 24px;border-radius:12px;font-size:14px;font-weight:500;opacity:0;transition:all .4s;pointer-events:none;z-index:100;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 8px 32px rgba(0,0,0,.5)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@keyframes fadeSlideUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:700px){body{padding:20px 12px 40px}.preview-grid{grid-template-columns:1fr}.header h1{font-size:24px}.image-item{width:100px}.image-item-thumb{width:84px;height:62px}.image-list-body{max-height:176px}}
</style>
</head>
<body>

<div class="header">
  <h1>Image Sharpen</h1>
  <p>四种专业级锐化算法 · RCAS / Adaptive USM / High-Pass / 去卷积</p>
</div>

<div class="container">
  <div class="upload-area" id="uploadArea">
    <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
    </svg>
    <p>拖拽图片到此处，或点击上传</p>
    <p class="hint">支持批量上传 JPG / PNG / WebP</p>
    <input type="file" id="fileInput" accept="image/*" multiple style="display:none">
  </div>

  <div class="image-list-section" id="imageListSection" style="display:none">
    <div class="image-list-header">
      <span>图片列表 <span class="count" id="imageCount">0</span> 张</span>
      <button class="btn btn-outline" id="clearAllBtn" style="padding:5px 12px;font-size:11px;border-radius:8px">清空列表</button>
    </div>
    <div class="image-list-body" id="imageListBody"></div>
  </div>

  <div class="controls-card" id="controlsSection" style="display:none">
    <div class="sec-title">锐化方法</div>
    <div class="method-grid">
      <button class="method-btn active" data-method="rcas">RCAS</button>
      <button class="method-btn" data-method="adaptive_usm">Adaptive USM</button>
      <button class="method-btn" data-method="high_pass">High-Pass</button>
      <button class="method-btn" data-method="deconv">去卷积</button>
    </div>
    <div class="method-desc" id="methodDesc">AMD FSR 对比自适应锐化 — 5-tap 十字滤波器，几乎无伪影</div>
    <div class="presets-wrap"><div class="preset-row" id="presetRow"></div></div>
    <div class="slider-group" id="strengthGroup">
      <div style="display:flex;justify-content:space-between"><label>强度</label><span class="slider-val" id="strengthVal">0.80</span></div>
      <div class="slider-row"><input type="range" id="strengthSlider" min="0" max="100" value="80"></div>
    </div>
    <div class="slider-group" id="radiusGroup">
      <div style="display:flex;justify-content:space-between"><label>半径</label><span class="slider-val" id="radiusVal">1.0</span></div>
      <div class="slider-row"><input type="range" id="radiusSlider" min="5" max="50" value="10"></div>
    </div>
    <div class="slider-group" id="thresholdGroup">
      <div style="display:flex;justify-content:space-between"><label>阈值</label><span class="slider-val" id="thresholdVal">0.05</span></div>
      <div class="slider-row"><input type="range" id="thresholdSlider" min="0" max="50" value="5"></div>
    </div>
    <div class="slider-group" id="iterGroup">
      <div style="display:flex;justify-content:space-between"><label>迭代</label><span class="int-slider" id="iterVal">10</span></div>
      <div class="slider-row"><input type="range" id="iterSlider" min="1" max="30" value="10"></div>
    </div>
    <div style="display:flex;gap:8px;margin-top:10px">
      <button class="btn btn-primary" id="previewBtn" style="padding:8px 18px;font-size:13px">应用 / 刷新预览</button>
    </div>
  </div>

  <div class="preview-grid" id="previewSection" style="display:none">
    <div class="preview-card"><div class="preview-header"><span>原始图片</span><span class="dim" id="origDims">—</span></div><div class="preview-canvas-wrap"><canvas id="origCanvas"></canvas><div class="preview-placeholder" id="origPlaceholder">选择图片后显示预览</div></div></div>
    <div class="preview-card"><div class="preview-header"><span>锐化后</span><span class="dim" id="resultDims">—</span></div><div class="preview-canvas-wrap"><canvas id="resultCanvas"></canvas><div class="preview-placeholder" id="resultPlaceholder">调整参数后点击「应用」预览</div></div>
    <div class="status-bar" id="statusBar"><div class="spinner"></div><span id="statusText">正在处理...</span></div>
    </div>
  </div>

  <div class="progress-wrap" id="progressWrap">
    <div class="progress-bar-track"><div class="progress-bar-fill" id="progressFill"></div></div>
    <div class="progress-label"><span id="progressText">处理中...</span><span id="progressPercent">0%</span></div>
  </div>

  <div class="actions" id="actionsSection" style="display:none">
    <button class="btn btn-primary" id="downloadBtn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>下载当前</button>
    <button class="btn btn-primary" id="downloadAllBtn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>锐化全部 <span id="batchCount">(0)</span></button>
    <button class="btn btn-secondary" id="addMoreBtn">添加更多</button>
    <button class="btn btn-outline" id="resetBtn">重新开始</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ═══ 锐化引擎（保持不变）════════════════════════════
const METHODS = {
  rcas:{label:'RCAS',desc:'AMD FSR 对比自适应锐化 — 5-tap 十字滤波器，几乎无伪影',hasRadius:false,hasThreshold:false,hasIter:false,defaultStrength:.8,defaultRadius:1,defaultThreshold:.05,defaultIter:10,
    presets:[{label:'轻微锐化',s:.4},{label:'标准锐化',s:.65},{label:'强力锐化',s:.9},{label:'极致锐化',s:1}]},
  adaptive_usm:{label:'Adaptive USM',desc:'自适应反锐化掩模 — 根据局部纹理密度调节锐化量',hasRadius:true,hasThreshold:true,hasIter:false,defaultStrength:.5,defaultRadius:1,defaultThreshold:.05,defaultIter:10,
    presets:[{label:'轻微',s:.3,r:.8,t:.08},{label:'标准',s:.5,r:1,t:.05},{label:'强力',s:.8,r:1.5,t:.03},{label:'极致',s:1.2,r:1.2,t:.02},{label:'降噪锐化',s:.6,r:2.5,t:.15}]},
  high_pass:{label:'High-Pass',desc:'高频增强 — 提取高频细节叠加回原图',hasRadius:true,hasThreshold:false,hasIter:false,defaultStrength:.5,defaultRadius:1,defaultThreshold:.05,defaultIter:10,
    presets:[{label:'纹理增强',s:.3,r:.8},{label:'标准清晰',s:.5,r:1},{label:'强力通透',s:.8,r:1.2},{label:'柔和发光',s:.4,r:3},{label:'锐利边缘',s:1.2,r:.6}]},
  deconv:{label:'去卷积',desc:'Richardson-Lucy 迭代去卷积 — 可恢复失焦模糊',hasRadius:true,hasThreshold:false,hasIter:true,defaultStrength:.5,defaultRadius:1,defaultThreshold:.05,defaultIter:10,
    presets:[{label:'轻微去模糊',s:.3,r:.8,i:8},{label:'标准去模糊',s:.5,r:1,i:10},{label:'强力去模糊',s:.7,r:1.5,i:20},{label:'极致修复',s:.9,r:2,i:30},{label:'快速预览',s:.4,r:.8,i:5}]},
};

const _blurCvs = document.createElement('canvas');
const _blurCtx = _blurCvs.getContext('2d');
function canvasBlur(imgData, sigma) { _blurCvs.width = imgData.width; _blurCvs.height = imgData.height; _blurCtx.putImageData(imgData, 0, 0); _blurCtx.filter = `blur(${sigma}px)`; _blurCtx.drawImage(_blurCvs, 0, 0); return _blurCtx.getImageData(0, 0, imgData.width, imgData.height); }
function canvasLocalStd(imgData, sigma) {
  const w = imgData.width, h = imgData.height, d = imgData.data, mean = canvasBlur(imgData, sigma);
  const sq = new Uint8ClampedArray(d.length); for (let i = 0; i < d.length; i += 4) { sq[i] = d[i]*d[i]/255; sq[i+1] = d[i+1]*d[i+1]/255; sq[i+2] = d[i+2]*d[i+2]/255; sq[i+3] = 255; }
  const meanSq = canvasBlur(new ImageData(sq, w, h), sigma); const out = new Uint8ClampedArray(d.length);
  for (let i = 0; i < d.length; i += 4) { const vr = Math.max(0, meanSq.data[i]/255 - (mean.data[i]/255)**2), vg = Math.max(0, meanSq.data[i+1]/255 - (mean.data[i+1]/255)**2), vb = Math.max(0, meanSq.data[i+2]/255 - (mean.data[i+2]/255)**2), l = Math.sqrt((vr+vg+vb)/3)*255; out[i]=out[i+1]=out[i+2]=l; out[i+3]=255; }
  return new ImageData(out, w, h);
}
function buildKernel1D(sigma) { const r = Math.max(1, Math.ceil(sigma*2.5)), size = 2*r+1, k = new Float32Array(size); let sum = 0; for (let i = 0; i < size; i++) { const x = i-r; k[i] = Math.exp(-(x*x)/(2*sigma*sigma)); sum += k[i]; } for (let i = 0; i < size; i++) k[i] /= sum; return {k,r}; }
function rcasProcess(imgData, strength) {
  const w = imgData.width, h = imgData.height, d = imgData.data, out = new Uint8ClampedArray(d.length), atten = Math.max(0, Math.min(1, strength));
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) { const ci=(y*w+x)*4,ni=(Math.max(0,y-1)*w+x)*4,si=(Math.min(h-1,y+1)*w+x)*4,wi=(y*w+Math.max(0,x-1))*4,ei=(y*w+Math.min(w-1,x+1))*4; for (let c = 0; c < 3; c++) { const cen=d[ci+c],n=d[ni+c],s=d[si+c],ww=d[wi+c],e=d[ei+c],mn=Math.min(Math.min(n,s),Math.min(ww,e),cen),mx=Math.max(Math.max(n,s),Math.max(ww,e),cen); let lobe=-(mn/Math.max(mx*4,1e-6)); lobe=Math.max(lobe,-(1-mx)/Math.max(4*(1-mn),1e-6)); lobe=Math.max(-0.1875,Math.min(0,lobe*atten)); out[ci+c]=Math.max(0,Math.min(255,(cen+lobe*(n+s+ww+e))/(1+4*lobe))); } out[ci+3]=d[ci+3]; }
  return new ImageData(out, w, h);
}
function aUsmProcess(imgData, strength, radius, threshold) { const blurred = canvasBlur(imgData, radius), std = canvasLocalStd(imgData, radius*1.5), w=imgData.width,h=imgData.height,d=imgData.data,b=blurred.data,s=std.data,out=new Uint8ClampedArray(d.length),th=Math.max(.001,threshold)*255; for(let i=0;i<d.length;i+=4){for(let c=0;c<3;c++){const detail=d[i+c]-b[i+c],mod=Math.min(1,s[i]/th);out[i+c]=Math.max(0,Math.min(255,d[i+c]+strength*detail*mod))}out[i+3]=d[i+3]} return new ImageData(out,w,h); }
function hpProcess(imgData, strength, radius) { const blurred = canvasBlur(imgData, radius), w=imgData.width,h=imgData.height,d=imgData.data,b=blurred.data,out=new Uint8ClampedArray(d.length); for(let i=0;i<d.length;i+=4){for(let c=0;c<3;c++)out[i+c]=Math.max(0,Math.min(255,d[i+c]+strength*(d[i+c]-b[i+c])));out[i+3]=d[i+3]} return new ImageData(out,w,h); }
function deconvProcess(imgData, strength, radius, iterations) {
  const w = imgData.width, h = imgData.height, d = imgData.data, {k,r:kr} = buildKernel1D(radius), observed = new Float32Array(d), tmp1=new Float32Array(d.length), ratio=new Float32Array(d.length), corr=new Float32Array(d.length); let estimate = new Float32Array(d);
  function convolve(src,dst){dst.fill(0);for(let y=0;y<h;y++)for(let x=0;x<w;x++){const idx=(y*w+x)*4;let r=0,g=0,b=0;for(let kk=-kr;kk<=kr;kk++){const sx=Math.min(w-1,Math.max(0,x+kk)),kw=k[kk+kr];r+=src[(y*w+sx)*4]*kw;g+=src[(y*w+sx)*4+1]*kw;b+=src[(y*w+sx)*4+2]*kw}dst[idx]=r;dst[idx+1]=g;dst[idx+2]=b}for(let y=0;y<h;y++)for(let x=0;x<w;x++){const idx=(y*w+x)*4;let r=0,g=0,b=0;for(let kk=-kr;kk<=kr;kk++){const sy=Math.min(h-1,Math.max(0,y+kk)),kw=k[kk+kr];r+=dst[(sy*w+x)*4]*kw;g+=dst[(sy*w+x)*4+1]*kw;b+=dst[(sy*w+x)*4+2]*kw}dst[idx]=Math.max(r,1e-3);dst[idx+1]=Math.max(g,1e-3);dst[idx+2]=Math.max(b,1e-3)}}
  for(let it=0;it<iterations;it++){convolve(estimate,tmp1);for(let i=0;i<d.length;i+=4){ratio[i]=observed[i]/tmp1[i];ratio[i+1]=observed[i+1]/tmp1[i+1];ratio[i+2]=observed[i+2]/tmp1[i+2]}convolve(ratio,corr);for(let i=0;i<d.length;i+=4){estimate[i]=Math.max(0,Math.min(255,estimate[i]*corr[i]));estimate[i+1]=Math.max(0,Math.min(255,estimate[i+1]*corr[i+1]));estimate[i+2]=Math.max(0,Math.min(255,estimate[i+2]*corr[i+2]))}}
  const out = new Uint8ClampedArray(d.length); for(let i=0;i<d.length;i+=4){for(let c=0;c<3;c++)out[i+c]=Math.max(0,Math.min(255,d[i+c]+strength*(estimate[i+c]-d[i+c])));out[i+3]=d[i+3]} return new ImageData(out,w,h);
}
function runSharpen(imgData, method, strength, radius, threshold, iterations) { switch(method){case'rcas':return rcasProcess(imgData,strength);case'adaptive_usm':return aUsmProcess(imgData,strength,radius,threshold);case'high_pass':return hpProcess(imgData,strength,radius);case'deconv':return deconvProcess(imgData,strength,radius,iterations);default:return imgData} }
function scaleImageData(imgData, maxDim) { const w = imgData.width, h = imgData.height; if (w <= maxDim && h <= maxDim) return imgData; const scale = Math.min(1, maxDim/Math.max(w,h)), nw = Math.round(w*scale), nh = Math.round(h*scale); const c = document.createElement('canvas'); c.width = nw; c.height = nh; const ctx = c.getContext('2d'); const tmp = document.createElement('canvas'); tmp.width = w; tmp.height = h; tmp.getContext('2d').putImageData(imgData,0,0); ctx.drawImage(tmp,0,0,nw,nh); return ctx.getImageData(0,0,nw,nh); }

// ═══ 状态与 DOM ════════════════════════════════════
const state = { images:[], selectedId:null, method:'rcas', strength:.8, radius:1, threshold:.05, iter:10, processing:false, pendingDownload:null };
let idCounter = 0, _cancel = false;
const $ = id => document.getElementById(id);
const uploadArea = $('uploadArea'), fileInput = $('fileInput');
const imageListSection = $('imageListSection'), imageListBody = $('imageListBody'), imageCount = $('imageCount'), clearAllBtn = $('clearAllBtn');
const controlsSection = $('controlsSection'), previewSection = $('previewSection'), actionsSection = $('actionsSection');
const origCanvas = $('origCanvas'), resultCanvas = $('resultCanvas');
const origPlaceholder = $('origPlaceholder'), resultPlaceholder = $('resultPlaceholder');
const origDims = $('origDims'), resultDims = $('resultDims');
const methodBtns = document.querySelectorAll('.method-btn'), methodDesc = $('methodDesc'), presetRow = $('presetRow');
const strengthSlider = $('strengthSlider'), strengthVal = $('strengthVal');
const radiusSlider = $('radiusSlider'), radiusVal = $('radiusVal');
const thresholdSlider = $('thresholdSlider'), thresholdVal = $('thresholdVal');
const iterSlider = $('iterSlider'), iterVal = $('iterVal');
const previewBtn = $('previewBtn'), downloadBtn = $('downloadBtn'), downloadAllBtn = $('downloadAllBtn'), addMoreBtn = $('addMoreBtn'), resetBtn = $('resetBtn');
const batchCount = $('batchCount'), progressWrap = $('progressWrap'), progressFill = $('progressFill'), progressText = $('progressText'), progressPercent = $('progressPercent');
const statusBar = $('statusBar'), statusText = $('statusText'), toastEl = $('toast');
const sliderGroups = { strength:$('strengthGroup'), radius:$('radiusGroup'), threshold:$('thresholdGroup'), iter:$('iterGroup') };

function renderPresets() {
  const m = METHODS[state.method]; if (!m.presets) { presetRow.innerHTML=''; return; }
  presetRow.innerHTML = m.presets.map((p,i)=>`<button class="preset-chip" data-idx="${i}">${p.label}</button>`).join('');
  presetRow.querySelectorAll('.preset-chip').forEach(b=>b.addEventListener('click',()=>applyPreset(m.presets[+b.dataset.idx])));
}
function applyPreset(p) {
  if(p.s!==undefined){state.strength=p.s;strengthSlider.value=p.s*100;strengthVal.textContent=p.s.toFixed(2)}
  if(p.r!==undefined){state.radius=p.r;radiusSlider.value=p.r*10;radiusVal.textContent=p.r.toFixed(1)}
  if(p.t!==undefined){state.threshold=p.t;thresholdSlider.value=p.t*100;thresholdVal.textContent=p.t.toFixed(2)}
  if(p.i!==undefined){state.iter=p.i;iterSlider.value=p.i;iterVal.textContent=p.i}
  debouncePreview();
}
let _rafId = null;
function debouncePreview() { if (_rafId) cancelAnimationFrame(_rafId); _rafId = requestAnimationFrame(() => { _rafId = null; const s = getSelected(); if (s&&s.loaded) renderPreview(s); }); }
function getSelected() { return state.images.find(e => e.id === state.selectedId); }

// ─── 图片管理 ──────────────────────────────────────
function addImages(files) {
  const pending = [];
  for (const f of files) {
    if (!f.type.startsWith('image/')) continue;
    const id = ++idCounter, entry = { id, file:f, name:f.name, size:f.size, img:null, width:0, height:0, loaded:false };
    state.images.push(entry); pending.push(entry);
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        entry.img = img; entry.width = img.width; entry.height = img.height; entry.loaded = true;
        if (state.selectedId === entry.id || !state.selectedId) {
          if (!state.selectedId) selectImage(entry.id);
          else if (entry.id === state.selectedId) { renderOriginal(img); debouncePreview(); }
        }
        renderImageList(); updateBatchCount();
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(f);
  }
  if (pending.length) { if (state.images.filter(e=>e.loaded).length === pending.length) state.selectedId = pending[0].id; showSections(); renderImageList(); updateBatchCount(); }
}
function removeImage(id) {
  state.images = state.images.filter(e => e.id !== id);
  if (state.selectedId === id) state.selectedId = state.images.length ? state.images[0].id : null;
  renderImageList(); updateBatchCount();
  if (!state.images.length) { resetAll(); return; }
  const e = getSelected(); if (e&&e.loaded) { renderOriginal(e.img); debouncePreview(); } else clearPreview();
}
function selectImage(id) { state.selectedId = id; renderImageList(); const e = getSelected(); if (e&&e.loaded) { renderOriginal(e.img); debouncePreview(); } }
function renderImageList() {
  const loaded = state.images.filter(e => e.loaded); imageCount.textContent = loaded.length;
  if (!loaded.length) { imageListSection.style.display = 'none'; return; }
  imageListSection.style.display = 'block';
  imageListBody.innerHTML = loaded.map(e => `<div class="image-item ${e.id === state.selectedId ? 'active' : ''}" data-id="${e.id}"><img class="image-item-thumb" src="${e.img.src}" alt="" loading="lazy"><div class="image-item-info"><div class="image-item-name">${escHtml(e.name)}</div><div class="image-item-dims">${e.width} × ${e.height}</div></div><button class="image-item-remove" data-remove="${e.id}" title="移除">✕</button></div>`).join('');
  imageListBody.querySelectorAll('.image-item').forEach(el => el.addEventListener('click', e => { if (e.target.closest('.image-item-remove')) return; selectImage(+el.dataset.id); }));
  imageListBody.querySelectorAll('.image-item-remove').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); removeImage(+b.dataset.remove); }));
}
function escHtml(str) { const d = document.createElement('div'); d.textContent = str; return d.innerHTML; }
function showSections() { controlsSection.style.display = 'block'; previewSection.style.display = 'grid'; actionsSection.style.display = 'flex'; }
function updateBatchCount() { batchCount.textContent = `(${state.images.filter(e=>e.loaded).length})`; }
function resetAll() {
  state.images = []; state.selectedId = null; _cancel = true;
  imageListSection.style.display = 'none'; controlsSection.style.display = 'none'; previewSection.style.display = 'none'; actionsSection.style.display = 'none';
  progressWrap.classList.remove('show'); statusBar.classList.remove('show'); clearPreview(); fileInput.value = ''; updateBatchCount();
}

// ─── 预览 ──────────────────────────────────────────
function renderOriginal(img) {
  origPlaceholder.style.display = 'none'; const c=origCanvas, mh=380, s=img.height>mh?mh/img.height:1;
  c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
  const ctx=c.getContext('2d'); ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality='high'; ctx.drawImage(img,0,0,c.width,c.height);
  origDims.textContent=`${img.width} × ${img.height}`;
}
function clearPreview() { origPlaceholder.style.display='block'; resultPlaceholder.style.display='block'; origDims.textContent='—'; resultDims.textContent='—'; origCanvas.width=0; origCanvas.height=0; resultCanvas.width=0; resultCanvas.height=0; }
async function renderPreview(entry) {
  if (!entry||!entry.loaded||state.processing) return;
  const img = entry.img; state.processing = true;
  _cancel = true; await new Promise(r => setTimeout(r,1)); _cancel = false;
  statusBar.classList.add('show'); statusText.textContent = '处理中...';
  try {
    const cvs = document.createElement('canvas'); cvs.width=img.width; cvs.height=img.height;
    cvs.getContext('2d').drawImage(img,0,0);
    const fullData = cvs.getContext('2d').getImageData(0,0,img.width,img.height);
    const pd = scaleImageData(fullData,800);
    const t = performance.now();
    const result = runSharpen(pd,state.method,state.strength,state.radius,state.threshold,state.iter);
    const elapsed = ((performance.now()-t)/1000).toFixed(2);
    if (_cancel) { state.processing=false; statusBar.classList.remove('show'); return; }
    resultPlaceholder.style.display='none';
    const rc=resultCanvas,mh=380,s=img.height>mh?mh/img.height:1;
    rc.width=Math.round(img.width*s); rc.height=Math.round(img.height*s);
    const dCvs=document.createElement('canvas'); dCvs.width=result.width; dCvs.height=result.height;
    dCvs.getContext('2d').putImageData(result,0,0);
    rc.getContext('2d').drawImage(dCvs,0,0,rc.width,rc.height);
    resultDims.textContent=`${img.width} × ${img.height}`;
    statusText.textContent=`完成 (${elapsed}s)`;
    state.pendingDownload=null;
    if(!_cancel)scheduleFullRes(fullData);
  } catch(err) { console.error(err); statusText.textContent='出错: '+err.message; }
  finally { state.processing=false; setTimeout(()=>{if(!state.processing)statusBar.classList.remove('show')},1200); }
}
let _fullResTimer=null;
function scheduleFullRes(fullData) { if(_fullResTimer)clearTimeout(_fullResTimer); _fullResTimer=setTimeout(()=>{_fullResTimer=null;state.pendingDownload=runSharpen(fullData,state.method,state.strength,state.radius,state.threshold,state.iter);const elapsed=((performance.now()-800)/1000).toFixed(1);if(!state.processing){statusBar.classList.add('show');statusText.textContent=`就绪 (${elapsed}s)`;setTimeout(()=>{if(!state.processing)statusBar.classList.remove('show')},1000)}},800); }

// ─── 下载当前 ──────────────────────────────────────
downloadBtn.addEventListener('click',()=>{
  const sel=getSelected(); if(!sel||!sel.loaded){showToast('请先选择图片');return;}
  const cvs=document.createElement('canvas');cvs.width=sel.img.width;cvs.height=sel.img.height;
  cvs.getContext('2d').drawImage(sel.img,0,0);
  const full=cvs.getContext('2d').getImageData(0,0,sel.img.width,sel.img.height);
  const r=runSharpen(full,state.method,state.strength,state.radius,state.threshold,state.iter);
  const c=document.createElement('canvas');c.width=r.width;c.height=r.height;
  c.getContext('2d').putImageData(r,0,0);
  const link=document.createElement('a');link.download=`${sel.name.replace(/\.[^.]+$/,'')}_sharpened.png`;link.href=c.toDataURL('image/png');link.click();
  showToast('已下载');
});

// ─── 批量 ZIP ──────────────────────────────────────
downloadAllBtn.addEventListener('click',async()=>{
  const loaded=state.images.filter(e=>e.loaded);
  if(!loaded.length){showToast('没有可处理的图片');return}
  downloadAllBtn.disabled=true;progressWrap.classList.add('show');progressFill.style.width='0%';
  try{const zip=new JSZip();for(let i=0;i<loaded.length;i++){const e=loaded[i];progressText.textContent=`锐化: ${escHtml(e.name)}`;progressPercent.textContent=`${Math.round(i/loaded.length*100)}%`;progressFill.style.width=`${i/loaded.length*100}%`;await new Promise(r=>setTimeout(r,10));const cvs=document.createElement('canvas');cvs.width=e.img.width;cvs.height=e.img.height;cvs.getContext('2d').drawImage(e.img,0,0);const full=cvs.getContext('2d').getImageData(0,0,e.img.width,e.img.height);const r=runSharpen(full,state.method,state.strength,state.radius,state.threshold,state.iter);const c=document.createElement('canvas');c.width=r.width;c.height=r.height;c.getContext('2d').putImageData(r,0,0);const blob=await new Promise(res=>c.toBlob(b=>res(b),'image/png'));const stem=e.name.replace(/\.[^.]+$/,'');zip.file(`${stem}_sharpened.png`,blob)}progressText.textContent='正在打包 ZIP...';progressPercent.textContent='99%';progressFill.style.width='99%';const link=document.createElement('a');link.download=`sharpened_images_${loaded.length}pcs.zip`;link.href=URL.createObjectURL(await zip.generateAsync({type:'blob'}));link.click();URL.revokeObjectURL(link.href);showToast(`已完成！共处理 ${loaded.length} 张图片`)}catch(err){showToast('处理出错: '+err.message)}finally{downloadAllBtn.disabled=false;progressWrap.classList.remove('show');progressFill.style.width='0%'}
});

// ─── Events ────────────────────────────────────────
uploadArea.addEventListener('click',()=>fileInput.click());
fileInput.addEventListener('change',()=>{if(fileInput.files.length){addImages(fileInput.files);fileInput.value=''}});
uploadArea.addEventListener('dragover',e=>{e.preventDefault();uploadArea.classList.add('dragover')});
uploadArea.addEventListener('dragleave',()=>{uploadArea.classList.remove('dragover')});
uploadArea.addEventListener('drop',e=>{e.preventDefault();uploadArea.classList.remove('dragover');if(e.dataTransfer.files.length)addImages(e.dataTransfer.files);else showToast('请拖入图片文件')});
addMoreBtn.addEventListener('click',()=>fileInput.click());
clearAllBtn.addEventListener('click',resetAll);
resetBtn.addEventListener('click',resetAll);

methodBtns.forEach(btn=>{btn.addEventListener('click',()=>{methodBtns.forEach(b=>b.classList.remove('active'));btn.classList.add('active');state.method=btn.dataset.method;const m=METHODS[state.method];methodDesc.textContent=m.desc;sliderGroups.radius.style.display=m.hasRadius?'flex':'none';sliderGroups.threshold.style.display=m.hasThreshold?'flex':'none';sliderGroups.iter.style.display=m.hasIter?'flex':'none';state.strength=m.defaultStrength;strengthSlider.value=state.strength*100;strengthVal.textContent=state.strength.toFixed(2);state.radius=m.defaultRadius;radiusSlider.value=state.radius*10;radiusVal.textContent=state.radius.toFixed(1);state.threshold=m.defaultThreshold;thresholdSlider.value=state.threshold*100;thresholdVal.textContent=state.threshold.toFixed(2);state.iter=m.defaultIter;iterSlider.value=state.iter;iterVal.textContent=state.iter;renderPresets();debouncePreview()})});
strengthSlider.addEventListener('input',()=>{state.strength=strengthSlider.value/100;strengthVal.textContent=state.strength.toFixed(2);debouncePreview()});
radiusSlider.addEventListener('input',()=>{state.radius=radiusSlider.value/10;radiusVal.textContent=state.radius.toFixed(1);debouncePreview()});
thresholdSlider.addEventListener('input',()=>{state.threshold=thresholdSlider.value/100;thresholdVal.textContent=state.threshold.toFixed(2);debouncePreview()});
iterSlider.addEventListener('input',()=>{state.iter=+iterSlider.value;iterVal.textContent=state.iter;debouncePreview()});
previewBtn.addEventListener('click',()=>{const s=getSelected();if(s&&s.loaded)renderPreview(s)});

function showToast(m){toastEl.textContent=m;toastEl.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toastEl.classList.remove('show'),2400)}
let toastTimer;
const d=METHODS.rcas;strengthSlider.value=d.defaultStrength*100;strengthVal.textContent=d.defaultStrength.toFixed(2);radiusSlider.value=d.defaultRadius*10;radiusVal.textContent=d.defaultRadius.toFixed(1);thresholdSlider.value=d.defaultThreshold*100;thresholdVal.textContent=d.defaultThreshold.toFixed(2);iterSlider.value=d.defaultIter;iterVal.textContent=d.defaultIter;sliderGroups.radius.style.display='none';sliderGroups.threshold.style.display='none';sliderGroups.iter.style.display='none';renderPresets();
</script>
